server {
  server_name media.wakilisha.africa 35.176.216.27;

  root /opt/wakilisha-media;

  access_log /var/log/nginx/wakilisha-media.access.log;
  error_log /var/log/nginx/wakilisha-media.error.log;

  include /etc/nginx/snippets/wakilisha-media-responsive-images.conf;

  location ^~ /__admin/media-upload/ {
    client_max_body_size 30m;
    proxy_pass http://127.0.0.1:4017/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
  }

  location ^~ /__admin/media-upload-session/ {
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:4017/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location ^~ /derived-objects/ {
    return 404;
  }

  location ^~ /derivatives/ {
    try_files $uri =404;

    include /etc/nginx/snippets/wakilisha-media-cors-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /masters/ {
    return 404;
  }

  location ^~ /__private/media-master/ {
    return 404;
  }

  location ^~ /uploads/ {
    try_files $uri @upload_legacy_size_fallback;

    include /etc/nginx/snippets/wakilisha-media-cors-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location @upload_legacy_size_fallback {
    rewrite ^/uploads/(.*)-[0-9]+x[0-9]+\.(jpg|jpeg|png|webp)$ /uploads/$1.$2 last;
    return 404;
  }

  location / {
    try_files $uri =404;
  }

  location ~* \.(jpg|jpeg|png|gif|webp|svg|avif|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  listen [::]:443 ssl http2 ipv6only=on;
  listen 443 ssl http2;
  ssl_certificate /etc/letsencrypt/live/media.wakilisha.africa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/media.wakilisha.africa/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  if ($host = media.wakilisha.africa) {
    return 301 https://$host$request_uri;
  }

  listen 80;
  listen [::]:80;

  server_name media.wakilisha.africa 35.176.216.27;
  return 404;
}
