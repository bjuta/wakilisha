# WAKILISHA responsive media derivatives.
#
# Only fixed widths are accepted. Original files and public media URLs remain
# unchanged. Unsupported paths continue to return 404.

location ~* ^/__image/w320(/uploads/.+\.(?:jpg|jpeg|png|webp))$ {
  limit_except GET HEAD { deny all; }
  try_files $1 /wp-content$1 =404;
  image_filter resize 320 -;
  image_filter_buffer 20M;
  image_filter_interlace on;
  image_filter_jpeg_quality 82;
  image_filter_webp_quality 80;
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Wakilisha-Image-Width "320" always;
}

