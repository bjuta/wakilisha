# Phase 6B public Show + Audio transport routes.
#
# Render pgzizndxdyhqmtyywjmt to the exact deployment target and include
# these locations inside the canonical wakilisha.africa HTTPS server block.
# The upstream Edge Function owns transport only; Show and Audio authority
# remain in anonymous public RPCs.
#
# Resolve the Supabase transport upstream at request time.
# A transient DNS failure must never prevent nginx itself from starting.
# Public route variables remain in $args; only upstream DNS resolution is dynamic.
resolver 127.0.0.53 valid=30s ipv6=off;
set $wk_audio_public_upstream_host pgzizndxdyhqmtyywjmt.supabase.co;

location ~ "^/audio/enclosures/(?<wk_audio_publication_id>[0-9a-fA-F-]{36})\.mp3$" {
    proxy_ssl_server_name on;
    proxy_ssl_name pgzizndxdyhqmtyywjmt.supabase.co;
    proxy_set_header Host pgzizndxdyhqmtyywjmt.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    set $args "kind=enclosure&id=$wk_audio_publication_id";
    rewrite ^ /functions/v1/audio-public-delivery break;
    proxy_pass https://$wk_audio_public_upstream_host;
}

location ~ ^/shows/(?<wk_show_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/feed\.xml$ {
    proxy_ssl_server_name on;
    proxy_ssl_name pgzizndxdyhqmtyywjmt.supabase.co;
    proxy_set_header Host pgzizndxdyhqmtyywjmt.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    set $args "kind=rss&show=$wk_show_slug";
    rewrite ^ /functions/v1/audio-public-delivery break;
    proxy_pass https://$wk_audio_public_upstream_host;
}

# Restricted same-origin transport for existing publicly playable iTunes previews.
# No user-controlled hostname: fixed HTTPS upstream, fixed public preview pathname.
# Required for sample-level iOS Web Audio gain control; no master-file ingestion.
set $wk_audio_mix_preview_host audio-ssl.itunes.apple.com;
location ^~ /__wk-mix/itunes-assets/AudioPreview {
    # Never permit arbitrary paths, file types, or external origin selection.
    if ($uri !~ "^/__wk-mix/itunes-assets/AudioPreview[^/]*/v[0-9]+/.+\\.(m4a|mp3)$") {
        return 404;
    }
    proxy_ssl_server_name on;
    proxy_ssl_name audio-ssl.itunes.apple.com;
    proxy_set_header Host audio-ssl.itunes.apple.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_redirect off;
    proxy_intercept_errors on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_buffering off;
    rewrite ^/__wk-mix(/itunes-assets/.*)$ $1 break;
    proxy_pass https://$wk_audio_mix_preview_host$uri;
    add_header X-Content-Type-Options nosniff always;
}
