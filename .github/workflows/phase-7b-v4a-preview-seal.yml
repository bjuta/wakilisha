name: Phase 7B V4A Preview Seal

on:
  push:
    branches:
      - feat/phase-7b-v4a-adaptive-video-media

permissions:
  contents: write

concurrency:
  group: phase-7b-v4a-preview-seal
  cancel-in-progress: false

jobs:
  seal:
    if: ${{ !contains(github.event.head_commit.message, '[v4a-seal-artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_CLI_VERSION: "2.107.0"
      SUPABASE_TARGET_PROJECT_REF: pgzizndxdyhqmtyywjmt
      PREVIEW_PROJECT_REF: qbzvovteagnoqrywkozo
      PREVIEW_BRANCH_ID: c6d454ec-37f7-48c0-a3db-20cb87445703
      MIGRATION_FILE: supabase/migrations/20260902205000_phase_7b_v4a_adaptive_video_media_foundation.sql
      VERIFIER_FILE: scripts/control-plane/verify-phase-7b-v4a-adaptive-video-media.sql

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/phase-7b-v4a-adaptive-video-media

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Link exact disposable preview
        run: |
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" link \
            --project-ref "${PREVIEW_PROJECT_REF}"
          test "$(cat supabase/.temp/project-ref)" = "${PREVIEW_PROJECT_REF}"

      - name: Prove exact pending migration set
        run: |
          OUT="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push --dry-run --linked 2>&1)"
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -F "$(basename "${MIGRATION_FILE}")"
          COUNT="$(printf '%s\n' "$OUT" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' | sort -u | wc -l | tr -d '[:space:]')"
          test "$COUNT" = "1"

      - name: Apply candidate natively
        run: |
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push --linked

      - name: Prove zero pending after native apply
        run: |
          OUT="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push --dry-run --linked 2>&1)"
          printf '%s\n' "$OUT"
          COUNT="$( { printf '%s\n' "$OUT" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true; } | sort -u | wc -l | tr -d '[:space:]')"
          test "$COUNT" = "0"

      - name: Run permanent V4A verifier
        run: |
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db query \
            --linked \
            --file "${VERIFIER_FILE}" \
            | tee /tmp/v4a-verifier.log
          grep -F "PASS: Phase 7B V4A canonical Media processing-profile and adaptive Video authority is intact." /tmp/v4a-verifier.log

      - name: Generate replay proof and preview schema seal
        run: |
          node scripts/control-plane/record-migration-replay-proof.mjs \
            --migration "${MIGRATION_FILE}" \
            --preview-project-ref "${PREVIEW_PROJECT_REF}" \
            --preview-branch-id "${PREVIEW_BRANCH_ID}" \
            --verifier-file "${VERIFIER_FILE}"

      - name: Commit generated replay artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/types/database.types.ts \
            docs/engineering/live-schema-baseline.json \
            "docs/engineering/replay-proofs/$(basename "${MIGRATION_FILE}").json"
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Seal V4A preview replay [v4a-seal-artifacts]"
          git push origin HEAD:feat/phase-7b-v4a-adaptive-video-media
