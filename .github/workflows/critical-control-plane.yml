name: Critical Control Plane

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: critical
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONTROL_PLANE_BASE_REF: origin/main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Enforce migration replay contract
        run: node scripts/control-plane/verify-migration-replay-contract.mjs

      - name: Test migration replay contract
        run: npx vitest run test/control-plane/migration-replay-contract.test.ts

      - name: Enforce primitive compounding contract
        run: |
          node scripts/control-plane/verify-primitive-compounding.mjs
          npx vitest run test/control-plane/primitive-compounding.test.ts

      - name: Enforce Phase 7A kernel closure contract
        run: npx vitest run test/control-plane/phase-7a-kernel-closure.test.ts

      - name: Enforce Phase 7A K5A Video editorial boundary
        run: npx vitest run test/video/phase-7a-k5a-video-editorial-command-read-boundary.test.ts

      - name: Enforce Phase 7A K5B Video Editor composition
        run: npx vitest run test/video/phase-7a-k5b-video-editor-composition.test.ts

      - name: Enforce Phase 7A K5C Video version Trust convergence
        run: npx vitest run test/video/phase-7a-k5c-video-version-trust-convergence.test.ts

      - name: Enforce Phase 7A K5D Video correction provenance convergence
        run: npx vitest run test/video/phase-7a-k5d-video-correction-provenance-convergence.test.ts

      - name: Enforce Phase 7B V1 public Video read and delivery
        run: npx vitest run test/video/phase-7b-v1-public-video-read-delivery.test.ts

      - name: Enforce Phase 7B V2 public Video experience convergence
        run: npx vitest run test/video/phase-7b-v2-public-video-experience-convergence.test.ts

      - name: Enforce Phase 7B V3 Video provider source convergence
        run: npx vitest run test/video/phase-7b-v3-video-provider-source-convergence.test.ts

      - name: Require Supabase control-plane access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is required."
            exit 1
          fi

      - name: Resolve public RLS test credentials
        run: |
          npx --yes supabase@2.107.0 projects api-keys \
            --project-ref "$SUPABASE_PROJECT_REF" \
            -o json \
            > /tmp/supabase-api-keys.json

          ANON_KEY="$(
            node \
              scripts/control-plane/resolve-supabase-anon-key.mjs \
              /tmp/supabase-api-keys.json
          )"

          if [ -z "$ANON_KEY" ]; then
            echo "Could not resolve the public Supabase API key."
            exit 1
          fi

          echo "::add-mask::$ANON_KEY"
          echo "VITE_PUBLIC_SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Run critical security and lifecycle tests
        run: npm run test:critical

      - name: Enforce Post draft and authored Thread authority
        run: >-
          npx vitest run
          test/community/post-drafts-authored-threads-m8c3.test.ts
          test/community/post-thread-presentation-m8c3.test.ts
          test/community/post-thread-detail-m8c3.test.ts
          test/community/post-drafts-thread-composer-m8c3.test.ts
          test/community/post-thread-affordance-m8c3.test.ts

      - name: Enforce canonical Post mention product UI
        run: npx vitest run test/community/post-mentions-product-ui-m8c4.test.ts

      - name: Enforce public Post delete product UI
        run: npx vitest run test/community/post-delete-product-ui.test.ts

      - name: Enforce dedicated Notifications product UI
        run: npx vitest run test/community/notifications-page-m8c4.test.ts

      - name: Enforce public configuration and anonymous authority boundaries
        run: >-
          npx vitest run
          test/public-read-authority-boundary.test.ts
          test/security/configured-supabase-csp.test.ts
          test/security/configured-public-content-edge-origin.test.ts

      - name: Detect live schema and migration-history drift
        run: npm run schema:verify

      - name: Build application
        run: npm run performance:audit && npm run build:app
