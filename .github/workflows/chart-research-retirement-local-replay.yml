name: Chart Research Retirement Local Replay

on:
  pull_request:
  push:
    branches:
      - chore/retire-active-chart-research-programme

permissions:
  contents: read

concurrency:
  group: chart-research-retirement-local-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Clean replay accepted baseline without candidate
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE="supabase/migrations/20261007075400_chart_research_programme_retirement_v1.sql"
          HOLD="/tmp/20261007075400_chart_research_programme_retirement_v1.sql"

          test -f "$CANDIDATE"
          mv "$CANDIDATE" "$HOLD"

          supabase db reset --local --no-seed

          BASELINE_STATE="$(
            psql               'postgresql://postgres:postgres@127.0.0.1:54322/postgres'               -At               -F '|'               -c "select count(*)::text,max(version) from supabase_migrations.schema_migrations;"
          )"

          echo "BASELINE_STATE=$BASELINE_STATE"
          test "$BASELINE_STATE" = "207|20261006175212"

          mv "$HOLD" "$CANDIDATE"

      - name: Apply canonical retirement migration
        shell: bash
        run: |
          set -euo pipefail

          supabase migration up --local

          CANDIDATE_STATE="$(
            psql               'postgresql://postgres:postgres@127.0.0.1:54322/postgres'               -At               -F '|'               -c "select count(*)::text,max(version) from supabase_migrations.schema_migrations;"
          )"

          echo "CANDIDATE_STATE=$CANDIDATE_STATE"
          test "$CANDIDATE_STATE" = "208|20261007075400"

      - name: Run permanent retirement verifier
        shell: bash
        run: |
          set -euo pipefail

          psql             'postgresql://postgres:postgres@127.0.0.1:54322/postgres'             -v ON_ERROR_STOP=1             -f scripts/control-plane/verify-chart-research-programme-retirement.sql

      - name: Prove retired objects absent
        shell: bash
        run: |
          set -euo pipefail

          REMAINS="$(
            psql               'postgresql://postgres:postgres@127.0.0.1:54322/postgres'               -At               -c "
                select count(*)
                from (
                  select to_regclass('public.chart_research_windows') as oid
                  union all
                  select to_regclass('public.chart_research_observations')
                  union all
                  select to_regclass('private.chart_source_soak_v3_runs')
                ) x
                where oid is not null;
              "
          )"

          test "$REMAINS" = "0"

          echo "MIGRATION_SHA256=$(sha256sum supabase/migrations/20261007075400_chart_research_programme_retirement_v1.sql | awk '{print $1}')"
          echo "TYPES_SHA256=$(sha256sum src/types/database.types.ts | awk '{print $1}')"
          echo "SUPABASE_CLI=$(supabase --version | tail -1 | tr -d '[:space:]')"
          echo "WK_CHART_RESEARCH_RETIREMENT_LOCAL_REPLAY_PASS"
