name: MIZIZI URL Identity Production Control Plane

on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-url-identity-production-control-plane.yml"
      - "scripts/control-plane/mizizi-production-jit-runtime.mjs"
      - "scripts/control-plane/mizizi-url-identity-production-control-plane.mjs"
      - "scripts/control-plane/verify-mizizi-url-identity-authority-window-close.sql"
      - "supabase/migrations/20260922143000_mizizi_url_identity_authority_window_close_v1.sql"
      - "supabase/migrations/20260922171632_mizizi_release_slug_resume_integrity_v1.sql"
      - "scripts/control-plane/verify-mizizi-release-slug-resume-integrity.sql"
      - "supabase/migrations/20260925082706_public_music_identity_slice3_release_single_alignment_v1.sql"
      - "scripts/control-plane/verify-public-music-identity-slice3-release-single-alignment.sql"
      - "supabase/migrations/20260925141117_public_music_identity_track_slug_zero_v2.sql"
      - "scripts/registry/agents/mizizi/run.ts"
      - "scripts/registry/agents/mizizi/core.ts"
      - "test/registry/mizizi-url-identity-production-control-plane.test.ts"
      - "test/registry/mizizi-cultural-data-steward.test.ts"
      - "docs/engineering/mizizi-url-identity-programme-control-plane.md"
      - "docs/registry/MIZIZI_CULTURAL_DATA_STEWARD.md"
      - ".github/mizizi-url-identity-production-apply.json"
      - ".github/public-music-identity-release-single-alignment-apply.json"
      - ".github/public-music-identity-track-slug-zero-apply.json"
  push:
    branches:
      - main
    paths:
      - ".github/mizizi-url-identity-production-apply.json"
      - ".github/public-music-identity-release-single-alignment-apply.json"
      - ".github/public-music-identity-track-slug-zero-apply.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizizi-production-jit-control-plane
  queue: max

jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIZIZI_CONTROL_PLANE_MODE: preflight
      MIZIZI_EXPECTED_MAIN_SHA: ""
      MIZIZI_TRIGGER_FILE: ""
      MIZIZI_ARTIFACT_DIR: artifacts/mizizi-url-identity-production-control-plane

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Resolve reviewed Production intent
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          LEGACY_FILE=".github/mizizi-url-identity-production-apply.json"
          SINGLE_FILE=".github/public-music-identity-release-single-alignment-apply.json"
          TRACK_ZERO_FILE=".github/public-music-identity-track-slug-zero-apply.json"

          TOTAL="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"
          LEGACY_COUNT="$(printf '%s\n' "$CHANGED" | grep -Fxc "$LEGACY_FILE" || true)"
          SINGLE_COUNT="$(printf '%s\n' "$CHANGED" | grep -Fxc "$SINGLE_FILE" || true)"
          TRACK_ZERO_COUNT="$(printf '%s\n' "$CHANGED" | grep -Fxc "$TRACK_ZERO_FILE" || true)"

          if [ "$TOTAL" = "1" ] && [ "$LEGACY_COUNT" = "1" ] && [ "$SINGLE_COUNT" = "0" ] && [ "$TRACK_ZERO_COUNT" = "0" ]; then
            echo "MIZIZI_CONTROL_PLANE_MODE=apply" >> "$GITHUB_ENV"
            echo "MIZIZI_TRIGGER_FILE=$LEGACY_FILE" >> "$GITHUB_ENV"
          elif [ "$TOTAL" = "1" ] && [ "$LEGACY_COUNT" = "0" ] && [ "$SINGLE_COUNT" = "1" ] && [ "$TRACK_ZERO_COUNT" = "0" ]; then
            echo "MIZIZI_CONTROL_PLANE_MODE=apply" >> "$GITHUB_ENV"
            echo "MIZIZI_TRIGGER_FILE=$SINGLE_FILE" >> "$GITHUB_ENV"
          elif [ "$TOTAL" = "1" ] && [ "$LEGACY_COUNT" = "0" ] && [ "$SINGLE_COUNT" = "0" ] && [ "$TRACK_ZERO_COUNT" = "1" ]; then
            echo "MIZIZI_CONTROL_PLANE_MODE=apply" >> "$GITHUB_ENV"
            echo "MIZIZI_TRIGGER_FILE=$TRACK_ZERO_FILE" >> "$GITHUB_ENV"
          else
            echo "STOP: Production intent push must change exactly one reviewed URL-identity trigger file."
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          echo "MIZIZI_EXPECTED_MAIN_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Run current MIZIZI URL-identity control plane
        run: node scripts/control-plane/mizizi-url-identity-production-control-plane.mjs

      - name: Upload URL-identity control-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizizi-url-identity-production-control-plane-${{ github.run_id }}
          path: artifacts/mizizi-url-identity-production-control-plane
          if-no-files-found: ignore
          retention-days: 30
