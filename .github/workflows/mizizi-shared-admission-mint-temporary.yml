name: Temporary MIZIZI Shared Admission Migration Mint
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mizizi-shared-admission-mint-temporary.yml
permissions:
  contents: read
jobs:
  mint:
    if: github.event.pull_request.number == 1442 && github.head_ref == 'work/mizizi-charts-candidate-resolution-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact migration in unlinked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 24b31460e4e61198833825bc177366ef506112de
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 297
          test ! -e supabase/.temp/project-ref
          test -z "$(find supabase/migrations -maxdepth 1 -name '*_mizizi_desk_shared_source_admission.sql' -print)"
          supabase --version
          supabase migration new mizizi_desk_shared_source_admission
          p="$(find supabase/migrations -maxdepth 1 -type f -name '*_mizizi_desk_shared_source_admission.sql' -print)"
          test -f "$p"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 298
          test "$(printf '%s\n' supabase/migrations/*.sql | sort | tail -1)" = "$p"
          echo "MIZIZI_SHARED_ADMISSION_MINTED_FILE=$p"
          echo "MIZIZI_SHARED_ADMISSION_MINT=PASS"
