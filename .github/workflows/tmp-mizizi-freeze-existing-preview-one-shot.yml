name: MIZIZI QV2 Existing Preview Native One-Shot
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mizizi-freeze-existing-preview-one-shot.yml"
permissions:
  contents: read
concurrency:
  group: mizizi-freeze-existing-preview-one-shot
  cancel-in-progress: false
jobs:
  exact-one-file-existing-preview:
    name: exact-one-file-native-preview-only
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PREVIEW_REF: nkgfoppunmnkcumalxqp
      PROD_REF: pgzizndxdyhqmtyywjmt
      Q_MIGRATION: 20261017202800_mizizi_governed_question_freeze_v1.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify branch, target, pristine checkout and fixed migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "bjuta/wakilisha"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "feat/mizizi-governed-question-freeze-v1"
          test "$PREVIEW_REF" = "nkgfoppunmnkcumalxqp"
          test "$PREVIEW_REF" != "$PROD_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test ! -e supabase/.temp/project-ref
          test -z "$(git status --porcelain)"
          git fetch origin "refs/heads/$GITHUB_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          test -f "supabase/migrations/$Q_MIGRATION"
          test -f supabase/migrations/20261016064245_mizizi_research_pass_memory_v1.sql
          test -f supabase/migrations/20261016092731_mizizi_external_wikidata_research_intake_v1.sql
          test -f supabase/migrations/20261016114918_mizizi_research_job_retry_budget_v1.sql
          test -f supabase/migrations/20261017185928_mizizi_question_assessment_authority_v1.sql
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = 236
          echo WK_QV2_EXISTING_PREVIEW_EXACT_HEAD_AND_SCOPE=PASS
      - name: Install pinned Supabase CLI 2.107.0
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Capture independent read-only Preview baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wk-qv2-preview-snapshot.mjs" <<'NODE'
          import {createHash} from "node:crypto";
          import {readFileSync,writeFileSync} from "node:fs";
          const ref="nkgfoppunmnkcumalxqp";
          const query=[
            "SELECT",
            "(SELECT count(*)::int FROM supabase_migrations.schema_migrations) migration_count,",
            "(SELECT max(version) FROM supabase_migrations.schema_migrations) migration_head,",
            "(SELECT count(*)::int FROM mizizi_private.cases) cases,",
            "(SELECT count(*)::int FROM mizizi_private.research_passes) passes,",
            "(SELECT count(*)::int FROM mizizi_private.workspace_memberships) memberships,",
            "(SELECT count(*)::int FROM mizizi_private.write_holds) holds,",
            "(SELECT count(*)::int FROM platform_private.jobs) jobs,",
            "(SELECT count(*)::int FROM public.registry_tracks) tracks,",
            "to_regclass('mizizi_private.case_question_versions')::text question_table,",
            "to_regprocedure('public.admin_mizizi_freeze_case_question_v1(uuid,integer,uuid,integer,text,jsonb,text)')::text question_rpc,",
            "(SELECT md5(coalesce(jsonb_agg(to_jsonb(c) ORDER BY c.id),'[]'::jsonb)::text) FROM mizizi_private.cases c) cases_fp,",
            "(SELECT md5(coalesce(jsonb_agg(to_jsonb(p) ORDER BY p.id),'[]'::jsonb)::text) FROM mizizi_private.research_passes p) passes_fp,",
            "(SELECT md5(coalesce(jsonb_agg(to_jsonb(m) ORDER BY m.id),'[]'::jsonb)::text) FROM mizizi_private.workspace_memberships m) memberships_fp,",
            "(SELECT md5(coalesce(jsonb_agg(to_jsonb(h) ORDER BY h.id),'[]'::jsonb)::text) FROM mizizi_private.write_holds h) holds_fp,",
            "(SELECT md5(coalesce(jsonb_agg(to_jsonb(j) ORDER BY j.id),'[]'::jsonb)::text) FROM platform_private.jobs j) jobs_fp,",
            "(SELECT md5(coalesce(jsonb_agg(to_jsonb(l) ORDER BY l.id),'[]'::jsonb)::text) FROM mizizi_private.case_receipt_links l) receipt_links_fp"
          ].join(" ");
          const response=await fetch("https://api.supabase.com/v1/projects/"+ref+"/database/query/read-only",{
            method:"POST",headers:{Authorization:"Bearer "+process.env.SUPABASE_ACCESS_TOKEN,
              "Content-Type":"application/json"},body:JSON.stringify({query}),signal:AbortSignal.timeout(25000)});
          if(!response.ok)throw Error("STOP_QV2_READ_ONLY_API_HTTP_"+response.status);
          const payload=await response.json();
          const rows=Array.isArray(payload)?payload:(payload.result||payload.data);
          if(!Array.isArray(rows)||rows.length!==1)throw Error("STOP_QV2_READ_ONLY_RESULT_SHAPE");
          const row=rows[0];
          const data={cases:row.cases,passes:row.passes,memberships:row.memberships,
            holds:row.holds,jobs:row.jobs,tracks:row.tracks,cases_fp:row.cases_fp,
            passes_fp:row.passes_fp,memberships_fp:row.memberships_fp,
            holds_fp:row.holds_fp,jobs_fp:row.jobs_fp,receipt_links_fp:row.receipt_links_fp};
          const digest=createHash("sha256").update(JSON.stringify(data)).digest("hex");
          const file=process.env.RUNNER_TEMP+"/wk-mz-qv2-preview-before.json";
          if(process.env.WK_PREVIEW_PHASE==="before"){
            if(row.migration_count!==235||row.migration_head!=="20261017185928"||
              row.cases!==1||row.passes!==2||row.memberships!==1||row.holds!==1||
              row.tracks!==0||row.question_table!=="mizizi_private.case_question_versions"||row.question_rpc!==null)
              throw Error("STOP_QV2_EXISTING_PREVIEW_PRE_STATE_DRIFT");
            writeFileSync(file,JSON.stringify({data,digest}));
            console.log("WK_QV2_PREVIEW_235_AND_ALL_EXISTING_DATA_FINGERPRINTED=PASS");
          } else if(process.env.WK_PREVIEW_PHASE==="after") {
            if(row.migration_count!==236||row.migration_head!=="20261017202800"||
              row.question_table!=="mizizi_private.case_question_versions"||
              row.question_rpc!=="admin_mizizi_freeze_case_question_v1(uuid,integer,uuid,integer,text,jsonb,text)")
              throw Error("STOP_QV2_PREVIEW_MIGRATION_VERSION_OR_GATEWAY_DRIFT");
            const before=JSON.parse(readFileSync(file,"utf8"));
            if(before.digest!==digest||JSON.stringify(before.data)!==JSON.stringify(data))
              throw Error("STOP_QV2_PREEXISTING_CASE_RESEARCH_OR_AUTH_STATE_CHANGED");
            console.log("WK_QV2_PREVIEW_236_WITH_ALL_EXISTING_DATA_UNCHANGED=PASS");
          } else throw Error("STOP_QV2_UNKNOWN_SNAPSHOT_PHASE");
          NODE
          WK_PREVIEW_PHASE=before node "$RUNNER_TEMP/wk-qv2-preview-snapshot.mjs"
      - name: Link only the verified existing Preview
        shell: bash
        run: |
          set -euo pipefail
          test "$PREVIEW_REF" != "$PROD_REF"
          supabase link --project-ref "$PREVIEW_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          echo WK_QV2_PREVIEW_LINK_LOCKED=PASS
      - name: Native dry-run must show exactly one new migration
        shell: bash
        run: |
          set -euo pipefail
          DRY="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$DRY"
          ACTUAL="$( { printf '%s\n' "$DRY" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true; } | sort -u )"
          if [ "$ACTUAL" != "$Q_MIGRATION" ]; then
            echo STOP_QV2_SINGLE_PENDING_MIGRATION_CONTRACT
            exit 1
          fi
          echo WK_QV2_EXACT_ONE_PREVIEW_MIGRATION=PASS
      - name: Apply exactly one migration to linked existing Preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          test "$PREVIEW_REF" != "$PROD_REF"
          supabase db push --linked
          echo WK_QV2_EXISTING_PREVIEW_NATIVE_ONE_FILE_PUSH=PASS
      - name: Verify the exact new head and preserved Preview state
        shell: bash
        run: |
          set -euo pipefail
          WK_PREVIEW_PHASE=after node "$RUNNER_TEMP/wk-qv2-preview-snapshot.mjs"
          POST="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$POST"
          PENDING="$( { printf '%s\n' "$POST" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true; } | sort -u )"
          test -z "$PENDING"
          echo WK_QV2_EXACT_PREVIEW_236_NO_PENDING_AND_PRESERVED_DATA=PASS
