name: MIZIZI Preview Original Source Intake Qualification
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
concurrency:
  group: mizizi-preview-schema-qualification
  cancel-in-progress: false
jobs:
  originals:
    if: github.repository == 'bjuta/wakilisha' && github.ref == 'refs/heads/ops/mizizi-preview-qualification-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual private original bytes in approved Preview only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request, urllib.error, urllib.parse
          ref="ehkmjrjjhzyjkxdfsqdc"
          api="https://api.supabase.com/v1/projects/"+ref
          storage="https://ehkmjrjjhzyjkxdfsqdc.supabase.co/storage/v1/object/authenticated/"
          token=os.environ.get("SUPABASE_ACCESS_TOKEN","")
          if not token: raise SystemExit("MIZIZI_PREVIEW_MANAGEMENT_CREDENTIAL=STOP")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError("redirect denied")
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          def request(url,headers,limit,body=None):
              req=urllib.request.Request(url,headers=headers,data=body,method="POST" if body is not None else "GET")
              with opener.open(req,timeout=25) as resp:
                  if resp.status not in (200,201): raise ValueError("HTTP")
                  result=resp.read(limit+1)
              if len(result)>limit: raise ValueError("bound")
              return result
          mgmt={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json"}
          q="select source_key, original_bucket, original_object_key, original_sha256, original_byte_length, original_content_type, observed_depth, (original_verified_at is not null) as verified from platform_private.charts2_capture_receipts_v1 order by source_key"
          try:
              rows=json.loads(request(api+"/database/query",mgmt,100000,json.dumps({"query":q,"read_only":True}).encode()))
              allowed={"apple_ke":("text/html",100),"audiomack_ke":("text/html",100),"mdundo_ke":("text/html",100),"shazam_ke":("text/csv",200),"youtube_ke":("application/json",100)}
              if not isinstance(rows,list) or len(rows)!=5 or {r.get("source_key") for r in rows}!=set(allowed): raise ValueError("receipt population")
              print("MIZIZI_ORIGINAL_RECEIPT_INVENTORY=PASS",flush=True)
          except Exception:
              raise SystemExit("MIZIZI_ORIGINAL_RECEIPT_INVENTORY=STOP")
          try:
              # Fetch only the selected existing server credential. Never log
              # management results, credentials, URLs or original bytes.
              keys=json.loads(request(api+"/api-keys?reveal=false",mgmt,100000))
              selected=[x for x in keys if x.get("name")=="service_role" and isinstance(x.get("id"),str)]
              if len(selected)!=1: raise ValueError("service credential")
              kid=urllib.parse.quote(selected[0]["id"],safe="")
              detail=json.loads(request(api+"/api-keys/"+kid+"?reveal=true",mgmt,100000))
              key=detail.get("api_key","")
              if detail.get("name")!="service_role" or not isinstance(key,str) or len(key.split("."))!=3: raise ValueError("role")
              part=key.split(".")[1]
              claims=json.loads(base64.urlsafe_b64decode(part+"="*((4-len(part)%4)%4)))
              if claims.get("role")!="service_role" or claims.get("ref")!=ref: raise ValueError("scope")
              print("MIZIZI_PREVIEW_STORAGE_CREDENTIAL_SCOPE=PASS",flush=True)
          except Exception:
              raise SystemExit("MIZIZI_PREVIEW_STORAGE_CREDENTIAL_SCOPE=STOP")
          total=0
          for r in rows:
              s=r["source_key"]
              try:
                  mime,depth=allowed[s]
                  digest=r["original_sha256"]
                  size=r["original_byte_length"]
                  actual_type=r["original_content_type"]
                  if s=="youtube_ke" and actual_type=="text/csv": mime="text/csv"
                  ext={"text/html":"html","text/csv":"csv","application/json":"json"}[mime]
                  expected=s+"/"+digest[:2]+"/"+digest+"."+ext
                  if not re.fullmatch("[a-f0-9]{64}",digest) or type(size) is not int or not 0<size<=4000000 or r["verified"] is not True or r["original_bucket"]!="charts2-evidence-private-v1" or r["original_object_key"]!=expected or actual_type!=mime or r["observed_depth"]!=depth: raise ValueError("coordinate")
                  headers={"apikey":key,"Authorization":"Bearer "+key,"Accept-Encoding":"identity"}
                  data=request(storage+"charts2-evidence-private-v1/"+expected,headers,size)
                  if len(data)!=size or hashlib.sha256(data).hexdigest()!=digest: raise ValueError("bytes")
                  total+=depth
                  del data
                  print("MIZIZI_ORIGINAL_"+s.upper()+"_BYTES=PASS",flush=True)
              except Exception:
                  raise SystemExit("MIZIZI_ORIGINAL_"+s.upper()+"_BYTES=STOP")
          if total!=600: raise SystemExit("MIZIZI_ORIGINAL_POPULATION=STOP")
          print("MIZIZI_ORIGINAL_VERIFIED_FILES=5")
          print("MIZIZI_ORIGINAL_OBSERVED_POSITIONS=600")
          print("MIZIZI_ORIGINAL_NO_DB_MUTATION_OR_PROVIDER_DISCLOSURE=PASS")
          PY
