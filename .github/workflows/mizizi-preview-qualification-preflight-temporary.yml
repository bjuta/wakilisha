name: MIZIZI Live Runtime Credential Metadata
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Read-only presence checks, never print credentials or digests
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REPO_ANTHROPIC_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          EXACT_MODEL_PRESENT: ${{ secrets.MIZIZI_PREVIEW_ANTHROPIC_API_KEY != '' }}
          EXACT_OPERATOR_PRESENT: ${{ secrets.MIZIZI_PREVIEW_OPERATOR_JWT != '' }}
          EXACT_JIT_PRESENT: ${{ secrets.MIZIZI_PREVIEW_JIT_DATABASE_URL != '' }}
          EXACT_SERVICE_PRESENT: ${{ secrets.MIZIZI_PREVIEW_SERVICE_ROLE_KEY != '' }}
          EXACT_ANON_PRESENT: ${{ secrets.MIZIZI_PREVIEW_ANON_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in REPO_ANTHROPIC_PRESENT EXACT_MODEL_PRESENT EXACT_OPERATOR_PRESENT EXACT_JIT_PRESENT EXACT_SERVICE_PRESENT EXACT_ANON_PRESENT; do
            value="${!name}"
            test "$value" = true || test "$value" = false
            printf 'MIZIZI_%s=%s\n' "$name" "$value"
          done
          test -n "$SUPABASE_ACCESS_TOKEN"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          supabase secrets list --help >"$scratch/help" 2>&1
          grep -q -- '--project-ref' "$scratch/help"
          supabase secrets list --project-ref ehkmjrjjhzyjkxdfsqdc --output json >"$scratch/preview.json" 2>"$scratch/preview.err"
          python3 - "$scratch/preview.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          if isinstance(rows,dict): rows=rows.get("secrets")
          if not isinstance(rows,list): raise SystemExit("MIZIZI_SECRET_METADATA_SHAPE=STOP")
          names=set()
          for row in rows:
              if not isinstance(row,dict): raise SystemExit("MIZIZI_SECRET_METADATA_SHAPE=STOP")
              name={str(k).lower():v for k,v in row.items()}.get("name")
              if not isinstance(name,str): raise SystemExit("MIZIZI_SECRET_METADATA_SHAPE=STOP")
              names.add(name)
          for name in ("ANTHROPIC_API_KEY","BRAVE_API_KEY"):
              print("MIZIZI_PREVIEW_EDGE_"+name+"_PRESENT="+str(name in names).lower())
          print("MIZIZI_READ_ONLY_CREDENTIAL_METADATA=PASS")
          PY
