name: MIZIZI Calibration Flow Focused Acceptance
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
concurrency:
  group: mizizi-preview-schema-qualification
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'bjuta/wakilisha' && github.ref == 'refs/heads/ops/mizizi-preview-qualification-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e65b7bfbb71733ef8e3b5b84f0c04f3cbde0261
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Exact candidate focused offline contract acceptance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5e65b7bfbb71733ef8e3b5b84f0c04f3cbde0261
          npx --no-install vitest run test/registry/mizizi-chart-calibration-flow.test.ts test/registry/mizizi-research-worker-cycle.test.ts
