name: MIZIZI Mint Event Reopening Migration
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7f9720f37b727736c0f7dfbb774a64d27cf2ff3
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Mint forward migration without linking or hosted access
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b7f9720f37b727736c0f7dfbb774a64d27cf2ff3
          supabase migration new mizizi_desk_event_reopening
          file="$(find supabase/migrations -name '*_mizizi_desk_event_reopening.sql')"
          test -f "$file"
          printf 'MIZIZI_MINTED_MIGRATION=%s\n' "$file"
