name: MIZIZI Mint Recovery Migration
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5b280d63467eac152d9aa4b6ff71a9e5bcc7830
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Mint forward migration without linking or hosted access
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b5b280d63467eac152d9aa4b6ff71a9e5bcc7830
          supabase migration new mizizi_desk_unavailable_tool_outcomes
          file="$(find supabase/migrations -name '*_mizizi_desk_unavailable_tool_outcomes.sql')"
          test -f "$file"
          printf 'MIZIZI_MINTED_MIGRATION=%s\n' "$file"
