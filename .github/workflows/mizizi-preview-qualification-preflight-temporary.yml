name: MIZIZI Consolidated Batch Migration Mint
on:
  push:
    branches: [ops/mizizi-preview-qualification-preflight-20261127]
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 297a9be1225c8c5dd3ce4fc3fb4cd98ad1c5e3e6
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Mint exact unlinked migration filename
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "297a9be1225c8c5dd3ce4fc3fb4cd98ad1c5e3e6"
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = 299
          supabase migration new mizizi_desk_async_batch
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = 300
          git status --short
          echo MIZIZI_ASYNC_BATCH_CLI_MINT=PASS
