name: MIZIZI Research Notebook Focused Regression
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
concurrency:
  group: mizizi-preview-schema-qualification
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 14a8f1fe6cc8ed42295f2906ea90d86f8af692b8
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Exact offline runtime and worker checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 14a8f1fe6cc8ed42295f2906ea90d86f8af692b8
          for name in MIZIZI_PREVIEW_OPERATOR_JWT MIZIZI_PREVIEW_SERVICE_ROLE_KEY MIZIZI_PREVIEW_JIT_DATABASE_URL MIZIZI_PREVIEW_ANTHROPIC_API_KEY SUPABASE_ACCESS_TOKEN; do
            test -z "${!name:-}"
          done
          git diff --check 28ff4de1e880cda9336e4727aae4dba76ada994f HEAD
          npx --no-install vitest run test/registry/mizizi-chart-calibration-flow.test.ts test/registry/mizizi-research-worker-cycle.test.ts
