name: MIZIZI Preview Isolated Chromium Host Qualification
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
concurrency:
  group: mizizi-preview-schema-qualification
  cancel-in-progress: false
jobs:
  host:
    if: github.repository == 'bjuta/wakilisha' && github.ref == 'refs/heads/ops/mizizi-preview-qualification-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out accepted browser implementation
        uses: actions/checkout@v4
        with:
          ref: a716e9dcbd51f38d36c53da01401285ea7f4f637
          persist-credentials: false
      - name: Prepare exact locked browser dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install accepted dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Prove actual disposable host network boundary and real Chromium interaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a716e9dcbd51f38d36c53da01401285ea7f4f637
          image=mcr.microsoft.com/playwright:v1.63.0-noble
          docker pull "$image"
          name="mizizi-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          scratch="$(mktemp -d)"
          chmod 755 "$scratch"
          cat >"$scratch/probe.mjs" <<'JS'
          import assert from "node:assert/strict";
          import os from "node:os";
          import net from "node:net";
          import {createHash} from "node:crypto";
          import {chromium} from "/repo/node_modules/playwright/index.mjs";
          import {withDeskInteractiveBrowserV1} from "/repo/scripts/registry/agents/mizizi/runtime/desk-browser-reader-v1.mjs";
          assert.ok(Object.keys(os.networkInterfaces()).every(k=>k==="lo"));
          assert.equal(process.getuid(),1000);
          for(const key of Object.keys(process.env)) assert.ok(!/ANTHROPIC|SUPABASE|GH_TOKEN|GITHUB_TOKEN/i.test(key));
          const reachable=await new Promise(resolve=>{
            const socket=net.createConnection({host:"1.1.1.1",port:443});
            socket.once("connect",()=>{socket.destroy();resolve(true)});
            socket.once("error",()=>resolve(false));
            socket.setTimeout(1500,()=>{socket.destroy();resolve(false)});
          });
          assert.equal(reachable,false);
          console.log("MIZIZI_HOST_NO_DIRECT_EGRESS=PASS");
          const hash=x=>createHash("sha256").update(x).digest("hex");
          const browser=await chromium.launch({headless:true});
          try {
            const scope={jobId:"11111111-1111-4111-8111-111111111111",caseId:"22222222-2222-4222-8222-222222222222",workspaceId:"33333333-3333-4333-8333-333333333333",expectedRevision:1,workerId:"mizizi-isolation-probe",leaseExpiresAt:new Date(Date.now()+90000).toISOString()};
            const url="https://archive.org/catalogue";
            const body=new TextEncoder().encode('<html><body><main><button aria-expanded="false" onclick="this.setAttribute(\'aria-expanded\',\'true\');document.getElementById(\'credit\').hidden=false">Reveal credits</button><p id="credit" hidden>Host isolation fixture</p></main></body></html>');
            const evidence=await withDeskInteractiveBrowserV1({browser,scope,authorizeAction:async b=>b.operation!=="navigate"||b.url===url,authorizeRequest:async b=>b.url===url,readResource:async(b,digest)=>b.url===url?{requestSha256:digest,status:200,contentType:"text/html",body,sha256:hash(body)}:null},async session=>{
              let o=await session.navigate(url);
              assert.ok(!o.visibleText.includes("Host isolation fixture"));
              const button=o.elements.find(e=>e.kind==="expand"&&e.label==="Reveal credits");
              assert.ok(button);
              o=await session.expand(button.ref,o.generation);
              assert.ok(o.visibleText.includes("Host isolation fixture"));
              return session.capture({visual:true});
            });
            assert.equal(evidence.sha256,hash(evidence.body));
            assert.equal(evidence.visual.sha256,hash(evidence.visual.body));
            console.log("MIZIZI_HOST_REAL_CHROMIUM_CAPTURE=PASS");
          } finally {await browser.close();}
          assert.equal(browser.isConnected(),false);
          console.log("MIZIZI_HOST_BROWSER_CLOSED=PASS");
          JS
          chmod 644 "$scratch/probe.mjs"
          docker create --name "$name" --network none --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m --shm-size 256m -e HOME=/tmp -v "$PWD:/repo:ro" -v "$scratch/probe.mjs:/probe.mjs:ro" "$image" node /probe.mjs >/dev/null
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$name")" = none
          echo "MIZIZI_HOST_DOCKER_NETWORK_NONE=PASS"
          timeout --kill-after=5s 120s docker start -a "$name"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
          docker rm "$name" >/dev/null
          if docker inspect "$name" >/dev/null 2>&1; then exit 1; fi
          rm -rf "$scratch"
          echo "MIZIZI_HOST_CONTAINER_CLEANUP=PASS"
          echo "MIZIZI_HOST_PROBE_SYNTHETIC_NO_PROVIDER_OR_DATABASE_CALL=PASS"
