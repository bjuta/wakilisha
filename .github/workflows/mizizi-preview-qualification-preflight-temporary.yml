name: MIZIZI Preview Credential and Model Inventory
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'bjuta/wakilisha' && github.ref == 'refs/heads/ops/mizizi-preview-qualification-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Preview credential and read available model metadata only
        env:
          MIZIZI_PREVIEW_ANTHROPIC_API_KEY: ${{ secrets.MIZIZI_PREVIEW_ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,re,urllib.request,urllib.error
          key=os.environ.get("MIZIZI_PREVIEW_ANTHROPIC_API_KEY","")
          if not key or key.strip()!=key:
              raise SystemExit("MIZIZI_PREVIEW_CREDENTIAL=MISSING_OR_INVALID")
          print("MIZIZI_PREVIEW_CREDENTIAL=PRESENT",flush=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise ValueError("Redirect denied")
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          req=urllib.request.Request("https://api.anthropic.com/v1/models?limit=100",headers={"x-api-key":key,"anthropic-version":"2026-10-21","Accept":"application/json"},method="GET")
          try:
              with opener.open(req,timeout=20) as response:
                  if response.status!=200: raise ValueError("Invalid status")
                  data=response.read(1000001)
              if len(data)>1000000: raise ValueError("Response bound")
              obj=json.loads(data)
          except urllib.error.HTTPError as e:
              raise SystemExit("MIZIZI_MODEL_INVENTORY_HTTP="+str(e.code))
          except Exception:
              raise SystemExit("MIZIZI_MODEL_INVENTORY=UNCONFIRMED")
          rows=obj.get("data")
          if not isinstance(rows,list) or not rows or len(rows)>100 or obj.get("has_more") is not False:
              raise SystemExit("MIZIZI_MODEL_INVENTORY_SHAPE=STOP")
          for row in rows:
              mid=row.get("id","")
              if not isinstance(mid,str) or not re.fullmatch(r"claude-[A-Za-z0-9._-]{1,100}",mid): continue
              line=row.get("line")
              life=row.get("lifecycle")
              caps=row.get("capabilities") or {}
              batch=caps.get("batch") or {}
              out={"id":mid,"line":line if line in ("haiku","sonnet","opus","fable","mythos") else None,"lifecycle":life if life in ("active","deprecated","retired") else None,"batch":batch.get("supported") is True,"max_input_tokens":row.get("max_input_tokens") if type(row.get("max_input_tokens")) is int else None,"max_tokens":row.get("max_tokens") if type(row.get("max_tokens")) is int else None}
              print("MIZIZI_MODEL_METADATA="+json.dumps(out,separators=(",",":")))
          print("MIZIZI_MODEL_INVENTORY=PASS")
          print("MIZIZI_NO_INFERENCE_REQUEST=PASS")
          PY
