name: MIZIZI Mint Factual Note Custody Migration
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c82e04b052aa932f6bebac7d7f94a303107efda5
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Mint forward migration without linking or hosted access
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c82e04b052aa932f6bebac7d7f94a303107efda5
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 305
          test -z "$(find supabase/migrations -name '*_mizizi_desk_factual_note_custody.sql')"
          supabase migration new mizizi_desk_factual_note_custody
          file="$(find supabase/migrations -name '*_mizizi_desk_factual_note_custody.sql')"
          test -f "$file"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 306
          printf 'MIZIZI_MINTED_MIGRATION=%s\n' "$file"
