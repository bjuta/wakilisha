name: MIZIZI Preview Bounded Session Requalification
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    if: github.repository == 'bjuta/wakilisha' && github.ref == 'refs/heads/ops/mizizi-preview-qualification-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Mint exact integration recovery migration filename without hosted mutation
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new mizizi_terminal_integrated_research_retry
          minted="$(find supabase/migrations -maxdepth 1 -type f -name '*_mizizi_terminal_integrated_research_retry.sql' | sort | tail -n 1)"
          test -n "$minted"
          echo "MIZIZI_CLI_MINTED_MIGRATION=$minted"
          test "$(git diff --name-only)" = ""
