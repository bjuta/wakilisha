name: MIZIZI Preview Runner Input Preflight
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check required repository input presence only
        env:
          HAS_MIZIZI_PREVIEW_ANON_KEY: ${{ secrets.MIZIZI_PREVIEW_ANON_KEY != '' }}
          HAS_MIZIZI_PREVIEW_SERVICE_ROLE_KEY: ${{ secrets.MIZIZI_PREVIEW_SERVICE_ROLE_KEY != '' }}
          HAS_MIZIZI_PREVIEW_OPERATOR_JWT: ${{ secrets.MIZIZI_PREVIEW_OPERATOR_JWT != '' }}
          HAS_MIZIZI_PREVIEW_JIT_DATABASE_URL: ${{ secrets.MIZIZI_PREVIEW_JIT_DATABASE_URL != '' }}
          HAS_MIZIZI_PREVIEW_ANTHROPIC_API_KEY: ${{ secrets.MIZIZI_PREVIEW_ANTHROPIC_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MIZIZI_PREVIEW_ANON_KEY MIZIZI_PREVIEW_SERVICE_ROLE_KEY MIZIZI_PREVIEW_OPERATOR_JWT MIZIZI_PREVIEW_JIT_DATABASE_URL MIZIZI_PREVIEW_ANTHROPIC_API_KEY; do
            check="HAS_${name}"
            if [ "${!check}" = true ]; then
              printf "%s=PRESENT\n" "$name"
            else
              printf "%s=MISSING\n" "$name"
            fi
          done
          echo "PRESENCE_ONLY_NO_PROVIDER_OR_DATABASE_CALLS=PASS"
