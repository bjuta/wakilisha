name: MIZIZI Preview Qualification Preflight (read only)
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'bjuta/wakilisha' && github.ref == 'refs/heads/ops/mizizi-preview-qualification-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_REF: ehkmjrjjhzyjkxdfsqdc
      PROD_REF: pgzizndxdyhqmtyywjmt
      EXPECTED_HEAD: e5d08c2fa96de4044e7409d05c331c6d0c7cf211
    steps:
      - name: Check out exact approved integration candidate
        uses: actions/checkout@v4
        with:
          ref: e5d08c2fa96de4044e7409d05c331c6d0c7cf211
          persist-credentials: false
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Non-secret availability and migration preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REPO_ANTHROPIC_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PREVIEW_REF" != "$PROD_REF"
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = 299
          echo "MIZIZI_PREFLIGHT_EXACT_CANDIDATE=PASS"
          echo "MIZIZI_REPO_ANTHROPIC_SECRET_PRESENT=$REPO_ANTHROPIC_PRESENT"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "MIZIZI_MANAGEMENT_CREDENTIAL=MISSING"
            exit 1
          fi
          echo "MIZIZI_MANAGEMENT_CREDENTIAL=PRESENT"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          supabase secrets list --help >"$scratch/help" 2>&1
          if ! grep -q -- '--project-ref' "$scratch/help"; then
            echo "MIZIZI_SECRET_LIST_CLI_CONTRACT=UNCONFIRMED"; exit 1
          fi
          if ! supabase secrets list --project-ref "$PREVIEW_REF" --output json >"$scratch/preview.json" 2>"$scratch/preview.err"; then
            echo "MIZIZI_PREVIEW_SECRET_LIST=UNCONFIRMED"; exit 1
          fi
          if ! supabase secrets list --project-ref "$PROD_REF" --output json >"$scratch/prod.json" 2>"$scratch/prod.err"; then
            echo "MIZIZI_PRODUCTION_SECRET_METADATA=UNCONFIRMED"; exit 1
          fi
          python3 - "$scratch/preview.json" "$scratch/prod.json" <<'PY'
          import json, sys
          def rows(p):
              v=json.load(open(p))
              if isinstance(v,dict):
                  v=v.get("secrets")
              if not isinstance(v,list):
                  raise SystemExit("MIZIZI_SECRET_LIST_SHAPE=UNCONFIRMED")
              result={}
              for row in v:
                  if not isinstance(row,dict):
                      raise SystemExit("MIZIZI_SECRET_LIST_SHAPE=UNCONFIRMED")
                  item={str(k).lower():v for k,v in row.items()}
                  name=item.get("name")
                  if not isinstance(name,str) or name in result:
                      raise SystemExit("MIZIZI_SECRET_LIST_SHAPE=UNCONFIRMED")
                  result[name]=item
              return result
          pre,prod=map(rows,sys.argv[1:])
          print("MIZIZI_PREVIEW_SECRET_LIST=PASS")
          print("MIZIZI_PRODUCTION_SECRET_METADATA=PASS")
          for name in ("ANTHROPIC_API_KEY",):
              p=name in pre; q=name in prod
              print("MIZIZI_"+name+"_PREVIEW_PRESENT="+str(p).lower())
              print("MIZIZI_"+name+"_PRODUCTION_PRESENT="+str(q).lower())
              a=pre.get(name,{}).get("digest")
              b=prod.get(name,{}).get("digest")
              print("MIZIZI_"+name+"_DIGEST_PARITY="+(str(a==b).lower() if isinstance(a,str) and a and isinstance(b,str) and b else "unconfirmed"))
          PY
          # CLI-native forward plan only; no migration apply, secret set,
          # provider requests, credentials printed, fixtures or hosted writes.
          if ! supabase link --project-ref "$PREVIEW_REF" >"$scratch/link" 2>&1; then
            echo "MIZIZI_PREVIEW_LINK=UNCONFIRMED"; exit 1
          fi
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          echo "MIZIZI_PREVIEW_LINK=PASS"
          if ! supabase db push --dry-run --linked >"$scratch/dry" 2>&1; then
            echo "MIZIZI_PREVIEW_DRY_RUN=UNCONFIRMED"; exit 1
          fi
          python3 - "$scratch/dry" <<'PY'
          import pathlib,re,sys
          actual=sorted(set(re.findall(r"[0-9]{14}_[A-Za-z0-9_-]+\.sql",pathlib.Path(sys.argv[1]).read_text())))
          expected=sorted(p.name for p in pathlib.Path("supabase/migrations").glob("*.sql") if p.name > "20261126073912_charts2_artist_intake_grant_origin.sql")
          if len(expected)!=18 or actual!=expected:
              print("MIZIZI_PREVIEW_DRY_RUN_PENDING_SET=STOP")
              print("expected_count="+str(len(expected))+" actual_count="+str(len(actual)))
              raise SystemExit(1)
          print("MIZIZI_PREVIEW_DRY_RUN_PENDING_SET=PASS")
          print("MIZIZI_PREVIEW_DRY_RUN_COUNT=18")
          PY
          echo "MIZIZI_PREVIEW_PREFLIGHT_NO_APPLY=PASS"
