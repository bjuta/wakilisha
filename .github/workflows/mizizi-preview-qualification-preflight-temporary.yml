name: MIZIZI Finance Migration Filename Mint
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d64c01844db2e2f2fc57e418635dd27ffa84f7d
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact forward migration filename only
        run: |
          set -euo pipefail
          test "$(supabase --version)" = 2.107.0
          supabase migration new mizizi_desk_metered_sync_reconciliation
          path="$(find supabase/migrations -maxdepth 1 -name '*_mizizi_desk_metered_sync_reconciliation.sql' -print)"
          test -f "$path"
          echo "MIZIZI_MINTED_PATH=$path"
