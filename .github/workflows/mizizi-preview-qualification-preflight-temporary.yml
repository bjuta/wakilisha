name: MIZIZI Mint Same Case Recall Migration
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a67464ff37e9b2c055058fd73d52c9ebe510a48
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Mint forward migration without linking or hosted access
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6a67464ff37e9b2c055058fd73d52c9ebe510a48
          supabase migration new mizizi_desk_same_case_recall
          file="$(find supabase/migrations -name '*_mizizi_desk_same_case_recall.sql')"
          test -f "$file"
          printf 'MIZIZI_MINTED_MIGRATION=%s\n' "$file"
