name: MIZIZI Membership Recovery Migration Mint
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4c53c894454e69d1d01bff9f777aaa0a4eb96565
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint forward recovery migration filename only
        run: |
          set -euo pipefail
          test "$(supabase --version)" = 2.107.0
          supabase migration new mizizi_ownerless_workspace_recovery
          path="$(find supabase/migrations -maxdepth 1 -name '*_mizizi_ownerless_workspace_recovery.sql' -print)"
          test -f "$path"
          echo "MIZIZI_MINTED_PATH=$path"
