name: MIZIZI Consolidated Batch Focused Verification
on:
  push:
    branches: [ops/mizizi-preview-qualification-preflight-20261127]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83fe705144c31b82ad78bf9e05de26a3b2843d2f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact draft candidate without hosted credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "83fe705144c31b82ad78bf9e05de26a3b2843d2f"
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          npm ci --no-audit --no-fund
          npx vitest run test/registry/mizizi-research-worker-cycle.test.ts
          echo MIZIZI_BATCH_FOCUSED_VERIFICATION=PASS
