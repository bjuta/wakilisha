name: MIZIZI Open Web Discovery Migration Mint
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9355b51a7bcac2628a87c516482bb0155afbacad
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint forward recovery migration filename only
        run: |
          set -euo pipefail
          test "$(supabase --version)" = 2.107.0
          supabase migration new mizizi_open_web_discovery
          path="$(find supabase/migrations -maxdepth 1 -name '*_mizizi_open_web_discovery.sql' -print)"
          test -f "$path"
          echo "MIZIZI_MINTED_PATH=$path"
