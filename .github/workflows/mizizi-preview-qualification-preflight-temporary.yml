name: MIZIZI Interrupted Research Regression
on:
  push:
    branches:
      - ops/mizizi-preview-qualification-preflight-20261127
permissions:
  contents: read
concurrency:
  group: mizizi-preview-schema-qualification
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5b280d63467eac152d9aa4b6ff71a9e5bcc7830
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Exact offline runtime and worker checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b5b280d63467eac152d9aa4b6ff71a9e5bcc7830
          test -z "$(printenv MIZIZI_PREVIEW_OPERATOR_JWT || true)"
          test -z "$(printenv MIZIZI_PREVIEW_SERVICE_ROLE_KEY || true)"
          test -z "$(printenv MIZIZI_PREVIEW_JIT_DATABASE_URL || true)"
          test -z "$(printenv MIZIZI_PREVIEW_ANTHROPIC_API_KEY || true)"
          npx --no-install vitest run test/registry/mizizi-chart-calibration-flow.test.ts test/registry/mizizi-research-worker-cycle.test.ts

