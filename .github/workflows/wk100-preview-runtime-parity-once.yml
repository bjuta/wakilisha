name: WK100 Preview Runtime Parity Read-Only (One Time)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.event.pull_request.number == 1333 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/wk100-phase2-frozen-filter-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WK_PREVIEW_REF: vabruwtjzyxerxdsjtwz
      WK_PROD_REF: pgzizndxdyhqmtyywjmt
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.107.0'
          github-token: ${{ github.token }}
      - name: Secret names and digest parity, no values printed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          umask 077
          if ! supabase secrets list --project-ref "$WK_PROD_REF" --output json >/tmp/wk-prod.json 2>/tmp/wk-prod.err; then echo STOP_PRODUCTION_SECRET_LIST; exit 1; fi
          if ! supabase secrets list --project-ref "$WK_PREVIEW_REF" --output json >/tmp/wk-preview.json 2>/tmp/wk-preview.err; then echo STOP_PREVIEW_SECRET_LIST; exit 1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function parse(path) {
            const data=JSON.parse(fs.readFileSync(path,'utf8'));
            const arr=Array.isArray(data)?data:Array.isArray(data?.secrets)?data.secrets:Array.isArray(data?.result)?data.result:null;
            if(!arr)throw Error('STOP_SECRET_LIST_SHAPE');
            const map=new Map();
            for(const row of arr) {
              if(typeof row?.name!=='string'||map.has(row.name))throw Error('STOP_SECRET_LIST_ENTRY');
              map.set(row.name,row);
            }
            return map;
          }
          const prod=parse('/tmp/wk-prod.json'),preview=parse('/tmp/wk-preview.json');
          const keys=['WK100_RESEARCH_INTAKE_ENABLED','WK100_HTML_RESEARCH_INTAKE_ENABLED','WK100_RESEARCH_INTAKE_PROJECT_REF','SUPABASE_URL','SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY'];
          console.log('WK100_SECRET_NAME_INVENTORY=PASS');
          for(const key of keys) {
            const p=prod.get(key),q=preview.get(key);
            const a=p?.digest??p?.sha256,b=q?.digest??q?.sha256;
            console.log(key+' PROD='+(p?'present':'absent')+' PREVIEW='+(q?'present':'absent')+
              ' DIGEST='+(!a||!b?'unknown':a===b?'same':'different'));
          }
          console.log('WK100_PREVIEW_CUSTOM_NAMES='+ (keys.slice(0,3).every(k=>preview.has(k))?'complete':'incomplete'));
          NODE
          rm -f /tmp/wk-prod.json /tmp/wk-preview.json /tmp/wk-prod.err /tmp/wk-preview.err
      - name: Non-data-bearing gateway preflight and invalid JWT denial
        shell: bash
        run: |
          set -euo pipefail
          for fn in wk100-research-intake wk100-research-html-intake; do
            url="https://$WK_PREVIEW_REF.supabase.co/functions/v1/$fn"
            echo "WK100_FUNCTION=$fn"
            status="$(curl -sS --max-time 25 -X OPTIONS -H 'Origin: https://wakilisha.africa' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,apikey,content-type,x-client-info' -D /tmp/wk-hdr -o /dev/null -w '%{http_code}' "$url")"
            echo "OPTIONS_HTTP=$status"
            allow="$(awk 'tolower($0) ~ /^access-control-allow-origin:/{sub(/\r$/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/wk-hdr)"
            echo "OPTIONS_ALLOW_ORIGIN=$allow"
            case "$status" in 200|204) ;; *) echo STOP_OPTIONS_INGRESS; exit 1;; esac
            denied="$(curl -sS --max-time 25 -X POST -H 'Origin: https://wakilisha.africa' -H 'Content-Type: application/json' -H 'Authorization: Bearer wk100-invalid-signed-jwt-probe' -o /dev/null -w '%{http_code}' --data '{}' "$url")"
            echo "INVALID_JWT_HTTP=$denied"
            case "$denied" in 401|403) echo WK100_INVALID_JWT_DENIAL=PASS;; *) echo STOP_DENIAL_UNPROVEN; exit 1;; esac
          done
          rm -f /tmp/wk-hdr
          echo WK100_READONLY_PROTOCOL_PREFLIGHT=PASS
