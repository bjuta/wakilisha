name: Create Slice 3 External Identifier Migration Shell

on:
  push:
    branches:
      - feat/music-metadata-slice3-external-identifier-admission-v1

permissions:
  contents: write

jobs:
  create-migration:
    if: "${{ github.event.head_commit.message == 'ci: create slice3 external identifier migration shell' }}"
    runs-on: ubuntu-latest
    env:
      BRANCH: feat/music-metadata-slice3-external-identifier-admission-v1
      EXPECTED_BASE: a00f1d4099d72d06b90fcf40b82e1241a823b352
      MIGRATION_NAME: music_identity_rights_slice3_external_identifier_admission_v1
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Create canonical Supabase migration shell
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test -z "$(find supabase/migrations -maxdepth 1 -type f -name "*_${MIGRATION_NAME}.sql" -print -quit)"

          npx --yes supabase@2.107.0 migration new "$MIGRATION_NAME"

          NEW_MIGRATION="$(
            find supabase/migrations               -maxdepth 1               -type f               -name "*_${MIGRATION_NAME}.sql"               -print |
            sort |
            tail -n 1
          )"

          test -n "$NEW_MIGRATION"
          test -f "$NEW_MIGRATION"
          test ! -s "$NEW_MIGRATION"

          rm .github/workflows/slice3-create-external-id-migration-temp.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$NEW_MIGRATION" .github/workflows/slice3-create-external-id-migration-temp.yml
          git commit -m "chore: create Slice 3 external identifier migration shell"
          git push origin "HEAD:$BRANCH"

          echo "NEW_MIGRATION=$NEW_MIGRATION"
          echo "SLICE3_EXTERNAL_IDENTIFIER_MIGRATION_SHELL=PASS"
