name: RNB18 Stage 1 Temporary Fresh PostgreSQL Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rnb18-stage1-disposable-acceptance.yml'
      - 'scripts/acceptance/rnb18-stage1-replay-repair-v4-CANDIDATE.sql'
      - 'scripts/acceptance/run-rnb18-stage1-fresh-postgres.sh'
      - 'supabase/migrations/20261101210335_rnb18_stage1_archive_replay_authority_v1.sql'

permissions:
  contents: read

concurrency:
  group: rnb18-stage1-disposable-proof
  cancel-in-progress: true

jobs:
  fresh-postgres:
    name: fresh-pg17-private-archive-authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no remote Supabase authority
        shell: bash
        run: |
          test ! -e supabase/.temp/project-ref
          test -z "$(printenv SUPABASE_ACCESS_TOKEN || true)"
          test -z "$(printenv SUPABASE_PROJECT_REF || true)"
          bash -n scripts/acceptance/run-rnb18-stage1-fresh-postgres.sh
      - name: Verify exact one-time CLI-minted forward path and candidate body
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL=supabase/migrations/20261101210335_rnb18_stage1_archive_replay_authority_v1.sql
          SOURCE=scripts/acceptance/rnb18-stage1-replay-repair-v4-CANDIDATE.sql
          test -f "$CANONICAL"
          test -f "$SOURCE"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_rnb18_stage1_archive_replay_authority_v1.sql' | wc -l | tr -d ' ')" = "1"
          diff -u <(sed -n '/^BEGIN;$/,$p' "$SOURCE") <(sed -n '/^BEGIN;$/,$p' "$CANONICAL")
          test ! -e supabase/.temp/project-ref
          echo WK_RNB18_CANONICAL_CLI_MINT_AND_IDENTICAL_SQL=PASS
      - name: Execute genuine fresh PostgreSQL 17 acceptance
        shell: bash
        run: bash -x scripts/acceptance/run-rnb18-stage1-fresh-postgres.sh
