name: RNB18 Stage 1 Temporary Fresh PostgreSQL Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rnb18-stage1-disposable-acceptance.yml'
      - 'scripts/acceptance/rnb18-stage1-replay-repair-v4-CANDIDATE.sql'
      - 'scripts/acceptance/run-rnb18-stage1-fresh-postgres.sh'

permissions:
  contents: read

concurrency:
  group: rnb18-stage1-disposable-proof
  cancel-in-progress: true

jobs:
  fresh-postgres:
    name: fresh-pg17-private-archive-authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no remote Supabase authority
        shell: bash
        run: |
          test ! -e supabase/.temp/project-ref
          test -z "$(printenv SUPABASE_ACCESS_TOKEN || true)"
          test -z "$(printenv SUPABASE_PROJECT_REF || true)"
          bash -n scripts/acceptance/run-rnb18-stage1-fresh-postgres.sh
      - name: Install accepted CLI solely to mint an offline migration filename
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact forward migration path without applying SQL
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.107.0"
          test -z "$(printenv SUPABASE_ACCESS_TOKEN || true)"
          test -z "$(printenv SUPABASE_PROJECT_REF || true)"
          test ! -e supabase/.temp/project-ref
          test -z "$(find supabase/migrations -maxdepth 1 -type f -name '*_rnb18_stage1_archive_replay_authority_v1.sql' -print)"
          supabase migration new rnb18_stage1_archive_replay_authority_v1
          MINTED="$(find supabase/migrations -maxdepth 1 -type f -name '*_rnb18_stage1_archive_replay_authority_v1.sql' -print)"
          test -n "$MINTED"
          test "$(printf '%s\n' "$MINTED" | wc -l | tr -d ' ')" = "1"
          test -f "$MINTED"
          test ! -s "$MINTED"
          echo "WK_RNB18_CLI_MINTED_PATH=$MINTED"
          echo "WK_RNB18_CLI_MINTED_VERSION=$(basename "$MINTED")"
          echo "WK_RNB18_CLI_21070_OFFLINE_MINT=PASS"
      - name: Execute genuine fresh PostgreSQL 17 acceptance
        shell: bash
        run: bash -x scripts/acceptance/run-rnb18-stage1-fresh-postgres.sh
