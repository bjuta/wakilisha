name: MIZIZI QV3 Disposable SQL Replay (temporary)
on:
  push:
    branches: [feat/mizizi-source-family-attestation-v1]
    paths:
      - .github/workflows/mizizi-qv3-disposable-temporary.yml
      - supabase/migrations/20261017212255_mizizi_source_family_attestation_v1.sql
      - scripts/control-plane/verify-mizizi-question-source-attestations-v1.sql
permissions:
  contents: read
jobs:
  local-qv3-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refuse linked or credentialed target
        shell: bash
        run: |
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          echo WK_QV3_NO_REMOTE_TARGET=PASS
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Disposable replay of historical and QV3 migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          DB="$(docker ps --filter 'name=^supabase_db_' --format '{{.Names}}')"
          test -n "$DB"
          ACTUAL="$(docker exec -i "$DB" psql -X -qAt -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c "select count(*)::text||'|'||max(version) from supabase_migrations.schema_migrations")"
          test "$ACTUAL" = '237|20261017212255' || { echo "STOP_QV3_REPLAY_LEDGER=$ACTUAL"; exit 1; }
          docker exec -i "$DB" psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < scripts/control-plane/verify-mizizi-question-version-reader-v1.sql
          docker exec -i "$DB" psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < scripts/control-plane/verify-mizizi-question-freeze-v1.sql
          docker exec -i "$DB" psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < scripts/control-plane/verify-mizizi-question-source-attestations-v1.sql
          echo WK_QV3_237_LOCAL_REPLAY_AND_PRIVILEGE_VERIFIER_PASS
      - name: Destroy disposable database and volumes
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup
          test -z "$(docker ps --filter 'name=^supabase_db_' --format '{{.Names}}')"
          echo WK_QV3_DISPOSABLE_DESTROYED=PASS
