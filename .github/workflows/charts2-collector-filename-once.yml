# Temporary, remove before PR merge. No DB connection and no migration SQL.
name: Charts2 collector SQL filename authority (temporary)
on:
  push:
    branches: [feat/charts2-phase1-collector]
    paths: [.github/workflows/charts2-collector-filename-once.yml]
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - run: |
          set -euo pipefail
          supabase --version
          supabase migration new charts2_private_capture_gateway_v1
          p="$(find supabase/migrations -maxdepth 1 -name '*_charts2_private_capture_gateway_v1.sql' -print | sort | tail -1)"
          test -n "$p"
          echo "CHARTS2_MINTED_FILE=$p"
          echo "CHARTS2_MINT_UNLINKED=PASS"
