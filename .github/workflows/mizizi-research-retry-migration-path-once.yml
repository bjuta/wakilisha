name: MIZIZI Research Retry Migration Path Authority
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mizizi-research-retry-migration-path-once.yml"
permissions:
  contents: read
jobs:
  cli-generated-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove offline naming only
        shell: bash
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test ! -e supabase/.temp/project-ref
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Generate exact authoritative migration path
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new mizizi_research_job_retry_budget_v1
          test "$(find supabase/migrations -maxdepth 1 -name '*_mizizi_research_job_retry_budget_v1.sql' | wc -l | tr -d ' ')" = "1"
          f="$(find supabase/migrations -maxdepth 1 -name '*_mizizi_research_job_retry_budget_v1.sql')"
          printf 'WK_RESEARCH_RETRY_CLI_GENERATED_PATH=%s\n' "$f"
          test -f "$f"
          test ! -s "$f"
