name: MIZIZI Release Production Control Plane

on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-release-production-control-plane.yml"
      - "scripts/control-plane/mizizi-release-production-control-plane.mjs"
      - "test/registry/mizizi-release-production-control-plane.test.ts"
      - "test/registry/mizizi-cultural-data-steward.test.ts"
      - "test/release-taxonomy-public-identity.test.ts"
      - "docs/registry/MIZIZI_CULTURAL_DATA_STEWARD.md"
      - "docs/registry/mizizi-v1-1-release-taxonomy-audit.md"
      - ".github/mizizi-release-production-apply.json"
  push:
    branches:
      - main
    paths:
      - ".github/mizizi-release-production-apply.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizizi-release-production-control-plane
  cancel-in-progress: false

jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIZIZI_CONTROL_PLANE_MODE: ${{ github.event_name == 'push' && 'apply' || 'preflight' }}
      MIZIZI_EXPECTED_MAIN_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
      MIZIZI_TRIGGER_FILE: ${{ github.event_name == 'push' && '.github/mizizi-release-production-apply.json' || '' }}
      MIZIZI_ARTIFACT_DIR: artifacts/mizizi-release-production-control-plane

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run MIZIZI Release production control plane
        run: node scripts/control-plane/mizizi-release-production-control-plane.mjs

      - name: Upload MIZIZI Release control-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizizi-release-production-control-plane-${{ github.run_id }}
          path: artifacts/mizizi-release-production-control-plane
          if-no-files-found: ignore
          retention-days: 30
