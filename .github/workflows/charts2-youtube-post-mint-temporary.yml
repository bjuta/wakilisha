name: Temporary Charts2 YouTube POST Migration Mint
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/charts2-youtube-post-mint-temporary.yml
  push:
    branches:
      - fix/charts2-youtube-native-post-phase1
    paths:
      - .github/workflows/charts2-youtube-post-mint-temporary.yml
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact migration filename using accepted CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new charts2_youtube_native_post_v1
          p="$(find supabase/migrations -maxdepth 1 -name '*_charts2_youtube_native_post_v1.sql' -print | sort | tail -1)"
          test -n "$p"
          echo "CHARTS2_YOUTUBE_POST_MINTED_FILE=$p"
          echo "CHARTS2_YOUTUBE_POST_MINT=PASS"
