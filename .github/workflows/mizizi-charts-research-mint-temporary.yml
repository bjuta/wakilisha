name: Temporary MIZIZI Charts Research Migration Mint
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mizizi-charts-research-mint-temporary.yml
permissions:
  contents: read
jobs:
  mint:
    if: github.event.pull_request.number == 1442 && github.head_ref == 'work/mizizi-charts-candidate-resolution-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact migration filename in unlinked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3934e356249705485f79a8378b6c3644c1995ab5
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 282
          test -z "$(find supabase/migrations -maxdepth 1 -name '*_mizizi_charts_research_runtime_reconciliation.sql' -print)"
          supabase --version
          supabase migration new mizizi_charts_research_runtime_reconciliation
          p="$(find supabase/migrations -maxdepth 1 -type f -name '*_mizizi_charts_research_runtime_reconciliation.sql' -print)"
          test -f "$p"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 283
          test "$(printf '%s\n' supabase/migrations/*.sql | sort | tail -1)" = "$p"
          echo "MIZIZI_RESEARCH_MINTED_FILE=$p"
          echo "MIZIZI_RESEARCH_MINT=PASS"
