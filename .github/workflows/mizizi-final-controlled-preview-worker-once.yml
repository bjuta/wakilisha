name: MIZIZI One Controlled Source Recovery (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-final-controlled-preview-worker-once.yml"
permissions:
  contents: read
concurrency:
  group: mizizi-existing-authentic-preview-worker-only
  queue: max
jobs:
  one-exact-original-job:
    if: github.event.pull_request.number == 1243 && github.event.pull_request.head.repo.full_name == 'bjuta/wakilisha'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIZIZI_PREVIEW_PROJECT_REF: nkgfoppunmnkcumalxqp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Invoke exact existing case only when recorded attempt count is three
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          KEY_FILE="$RUNNER_TEMP/wk-one-time-preview-api-keys.json"
          umask 077
          trap 'rm -f "$KEY_FILE"' EXIT
          supabase projects api-keys --project-ref nkgfoppunmnkcumalxqp -o json > "$KEY_FILE"
          node scripts/acceptance/invoke-mizizi-authentic-preview-worker-once.mjs "$KEY_FILE"
