name: WK100 Forward-Only Migration Filename Mint (One Time)
on:
  push:
    branches:
      - fix/wk100-pg239-forward-chronology-20261102
permissions:
  contents: write
jobs:
  mint:
    if: github.ref == 'refs/heads/fix/wk100-pg239-forward-chronology-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install official pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '2.107.0'
          github-token: ${{ github.token }}
      - name: CLI-mint three chronological replacement filenames
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git merge-base HEAD origin/main)" = '534b302628097bc64b8f946dce6cf261ed366a57'
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = '239'
          test ! -f docs/engineering/wk100-forward-chronology-mint-receipt-20261102.md
          mkdir -p docs/engineering/replay-baseline/retired-active-migrations
          mkdir -p docs/engineering/replay-baseline/superseded-preview-proofs
          out=docs/engineering/wk100-forward-chronology-mint-receipt-20261102.md
          printf '# WK100 Forward Migration Source Mapping\n\n**Status:** Candidate only; independent clean 239-file hosted replay and official schema reseal remain REQUIRED. No Production promotion authority.\n\nOriginal SQL bytes are preserved exactly under retired-active-migrations; prior hosted proof receipts remain historical evidence, not proof of the newly ordered chain.\n\n| Prior filename | Official CLI-minted replacement | SHA-256 source |\n|---|---|---|\n' > "$out"
          while IFS='|' read -r old slug; do
            oldfile="supabase/migrations/$old"
            test -f "$oldfile"
            proof="docs/engineering/replay-proofs/$old.json"
            test -f "$proof"
            original_sha="$(sha256sum "$oldfile" | awk '{print $1}')"
            recorded_sha="$(node -p 'require("./'"$proof"'").migration_sha256')"
            test "$original_sha" = "$recorded_sha"
            supabase migration new "$slug"
            newfile="$(find supabase/migrations -maxdepth 1 -type f -name "*_${slug}.sql" -print)"
            test -f "$newfile"
            version="$(basename "$newfile" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]]
            test "$version" -gt 20261101210335
            cp "$oldfile" "$newfile"
            test "$(sha256sum "$newfile" | awk '{print $1}')" = "$original_sha"
            git mv "$oldfile" docs/engineering/replay-baseline/retired-active-migrations/
            git mv "$proof" docs/engineering/replay-baseline/superseded-preview-proofs/
            printf '| `%s` | `%s` | `%s` |\n' "$old" "$(basename "$newfile")" "$original_sha" >> "$out"
            sleep 2
          done <<'SOURCES'
          20261030180827_chart_full_filter_decision_execution_v1.sql|wk100_full_filter_execution_forward_v1
          20261031194228_wk100_research_observation_ledger_v1.sql|wk100_research_observation_forward_v1
          20261101074119_wk100_html_research_ledger_v1.sql|wk100_html_research_forward_v1
          SOURCES
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = '239'
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20261102*_wk100_*_forward_v1.sql' | wc -l | tr -d ' ')" = '3'
          git diff --check
          git status --short
      - name: Commit source-only forward candidates to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- supabase/migrations docs/engineering/replay-baseline docs/engineering/replay-proofs docs/engineering/wk100-forward-chronology-mint-receipt-20261102.md
          git diff --cached --check
          git config user.name 'wakilisha-evidence-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(wk100): CLI-mint forward-only versions with byte-preserved original SQL'
          git push origin HEAD:refs/heads/fix/wk100-pg239-forward-chronology-20261102
          echo 'WK100_FORWARD_SOURCE_CANDIDATE_COMMITTED=PASS'
