name: Charts2 YouTube Browser Native Chart Proof (one-shot)
on:
  push:
    branches: [probe/charts2-phase1-live-http-20261118]
    paths: [.github/workflows/charts2-youtube-browser-once.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Visit official Kenya weekly songs chart with real Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import {createHash} from 'node:crypto';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({locale:'en-KE'});
          const targets=[];
          page.on('response',async (response)=>{
            const u=response.url();
            if(!u.includes('charts.youtube.com'))return;
            if(/youtubei\/v1\/browse|\/charts\/TopSongs\//.test(u)){
              const type=response.headers()['content-type']||'';
              const status=response.status();
              let digest='none', bytes=0, native_count=null, native_week_end=null;
              if(status===200 && type.includes('json')){
                try {
                  const body=await response.body();
                  bytes=body.length;
                  if(bytes>0 && bytes<4000000){
                    digest=createHash('sha256').update(body).digest('hex');
                    const data=JSON.parse(body.toString('utf8'));
                    const queue=[data],seen=new WeakSet();
                    while(queue.length){
                      const item=queue.shift();
                      if(!item||typeof item!=='object'||seen.has(item))continue;
                      seen.add(item);
                      if(item.listType==='TOP_VIEWS_CHART'&&item.chartPeriodType==='CHART_PERIOD_TYPE_WEEKLY'&&Array.isArray(item.trackViews)){
                        native_count=item.trackViews.length;native_week_end=item.endDate||null;
                        break;
                      }
                      for(const v of Object.values(item)) if(v&&typeof v==='object')queue.push(v);
                    }
                  }
                }catch(e){}
              }
              targets.push({status,type:type.split(';')[0],bytes,digest,native_count,native_week_end,kind:u.includes('youtubei/v1/browse')?'native_post':'chart_page'});
            }
          });
          const url='https://charts.youtube.com/charts/TopSongs/ke/weekly';
          let visit='unknown';
          try {
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            visit=String(res?.status()||'null');
            await page.waitForTimeout(12000);
          }catch(e){visit='error';}
          console.log('WK_CHARTS2_YOUTUBE_BROWSER_PAGE_HTTP='+visit);
          console.log('WK_CHARTS2_YOUTUBE_BROWSER_REQUESTS='+JSON.stringify(targets));
          console.log('WK_CHARTS2_YOUTUBE_BROWSER_TITLE_LENGTH='+(await page.title()).length);
          await browser.close();
          console.log('WK_CHARTS2_YOUTUBE_BROWSER_RESEARCH_ONLY_PASS=TRUE');
          NODE
