name: MIZIZI Track Production Control Plane

on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-track-production-control-plane.yml"
      - "scripts/control-plane/mizizi-track-production-control-plane.mjs"
      - "test/registry/mizizi-cultural-data-steward.test.ts"
      - "docs/registry/MIZIZI_CULTURAL_DATA_STEWARD.md"
      - ".github/mizizi-track-production-apply.json"
      - ".github/mizizi-track-production-review.json"
      - ".github/public-music-identity-track-slug-zero-apply.json"
  push:
    branches:
      - main
    paths:
      - ".github/mizizi-track-production-apply.json"
      - ".github/mizizi-track-production-review.json"
      - ".github/public-music-identity-track-slug-zero-apply.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizizi-production-jit-control-plane
  queue: max

jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_REGION: eu-west-2
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIZIZI_CONTROL_PLANE_MODE: preflight
      MIZIZI_EXPECTED_MAIN_SHA: ""
      MIZIZI_TRIGGER_FILE: ""
      MIZIZI_ARTIFACT_DIR: artifacts/mizizi-track-production-control-plane

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Resolve reviewed Production intent
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          APPLY_FILE=".github/mizizi-track-production-apply.json"
          REVIEW_FILE=".github/mizizi-track-production-review.json"
          ZERO_FILE=".github/public-music-identity-track-slug-zero-apply.json"

          TOTAL="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"
          APPLY_COUNT="$(printf '%s\n' "$CHANGED" | grep -Fxc "$APPLY_FILE" || true)"
          REVIEW_COUNT="$(printf '%s\n' "$CHANGED" | grep -Fxc "$REVIEW_FILE" || true)"
          ZERO_COUNT="$(printf '%s\n' "$CHANGED" | grep -Fxc "$ZERO_FILE" || true)"

          if [ "$TOTAL" = "1" ] && [ "$APPLY_COUNT" = "1" ] && [ "$REVIEW_COUNT" = "0" ] && [ "$ZERO_COUNT" = "0" ]; then
            echo "MIZIZI_CONTROL_PLANE_MODE=apply" >> "$GITHUB_ENV"
            echo "MIZIZI_TRIGGER_FILE=$APPLY_FILE" >> "$GITHUB_ENV"
          elif [ "$TOTAL" = "1" ] && [ "$APPLY_COUNT" = "0" ] && [ "$REVIEW_COUNT" = "1" ] && [ "$ZERO_COUNT" = "0" ]; then
            echo "MIZIZI_CONTROL_PLANE_MODE=review" >> "$GITHUB_ENV"
            echo "MIZIZI_TRIGGER_FILE=$REVIEW_FILE" >> "$GITHUB_ENV"
          elif [ "$TOTAL" = "1" ] && [ "$APPLY_COUNT" = "0" ] && [ "$REVIEW_COUNT" = "0" ] && [ "$ZERO_COUNT" = "1" ]; then
            echo "MIZIZI_CONTROL_PLANE_MODE=zero_apply" >> "$GITHUB_ENV"
            echo "MIZIZI_TRIGGER_FILE=$ZERO_FILE" >> "$GITHUB_ENV"
          else
            echo "STOP: Production intent push must change exactly one reviewed MIZIZI Track trigger file."
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          echo "MIZIZI_EXPECTED_MAIN_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Run MIZIZI production control plane
        run: node scripts/control-plane/mizizi-track-production-control-plane.mjs

      - name: Upload MIZIZI control-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizizi-track-production-control-plane-${{ github.run_id }}
          path: artifacts/mizizi-track-production-control-plane
          if-no-files-found: ignore
          retention-days: 30
