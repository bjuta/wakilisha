name: MIZIZI Track Production Control Plane

on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-track-production-control-plane.yml"
      - "scripts/control-plane/run-mizizi-track-production-control-plane.sh"
      - "test/registry/mizizi-cultural-data-steward.test.ts"
      - "docs/registry/MIZIZI_CULTURAL_DATA_STEWARD.md"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact merged main SHA to execute"
        required: true
        type: string
      confirm:
        description: "Type MIZIZI_TRACK_PRODUCTION_APPLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mizizi-track-production-control-plane
  cancel-in-progress: false

jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_REGION: eu-west-2
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIZIZI_CONTROL_PLANE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'apply' || 'preflight' }}
      MIZIZI_EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha || '' }}
      MIZIZI_PRODUCTION_CONFIRM: ${{ github.event.inputs.confirm || '' }}
      MIZIZI_ARTIFACT_DIR: artifacts/mizizi-track-production-control-plane

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run MIZIZI production control plane
        run: bash scripts/control-plane/run-mizizi-track-production-control-plane.sh

      - name: Upload MIZIZI control-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizizi-track-production-control-plane-${{ github.run_id }}
          path: artifacts/mizizi-track-production-control-plane
          if-no-files-found: ignore
          retention-days: 30
