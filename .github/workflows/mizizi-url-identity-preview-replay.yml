name: Temporary MIZIZI URL Identity Preview Replay

on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-url-identity-preview-replay.yml"

permissions:
  contents: read

jobs:
  preview-replay:
    name: preview-replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_REF: lscfgarfnhfqtohcdvmg
      TARGET: 20260922143000_mizizi_url_identity_authority_window_close_v1.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact disposable Preview target
        run: |
          set -euo pipefail
          test "$PREVIEW_REF" = "lscfgarfnhfqtohcdvmg"
          test "$PREVIEW_REF" != "pgzizndxdyhqmtyywjmt"
          test -f "supabase/migrations/$TARGET"

      - name: Link disposable Preview
        run: |
          set -euo pipefail
          npx --yes supabase@2.107.0 link --project-ref "$PREVIEW_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"

      - name: Require exactly one pending migration
        run: |
          set -euo pipefail
          DRY="$(npx --yes supabase@2.107.0 db push --dry-run --linked 2>&1)"
          printf '%s\n' "$DRY"
          PENDING="$(
            {
              printf '%s\n' "$DRY" |
                grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true
            } |
              sort -u
          )"
          test "$(printf '%s\n' "$PENDING" | wc -l | tr -d ' ')" = "1"
          test "$PENDING" = "$TARGET"

      - name: Native Preview replay
        run: |
          set -euo pipefail
          printf 'y\n' | npx --yes supabase@2.107.0 db push --linked

      - name: Require zero pending after replay
        run: |
          set -euo pipefail
          POST="$(npx --yes supabase@2.107.0 db push --dry-run --linked 2>&1)"
          printf '%s\n' "$POST"
          POST_PENDING="$(
            {
              printf '%s\n' "$POST" |
                grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true
            } |
              sort -u
          )"
          test -z "$POST_PENDING"
          echo "MIZIZI_URL_IDENTITY_PREVIEW_NATIVE_REPLAY=PASS"
