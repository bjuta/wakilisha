name: Charts2 One-Shot Forward Migration Filename Mint
on:
  push:
    branches:
      - "work/charts2-registry-convergence-current-main-20261123"
    paths:
      - ".github/workflows/charts2-one-shot-forward-mint.yml"
permissions:
  contents: read
jobs:
  mint:
    name: cli-mint-three-nonproduction-paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Generate three forward-only filenames without a database connection
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" -eq 275
          test ! -e supabase/.temp/project-ref
          n=0
          for name in charts2_governed_track_intake_origin_v2 charts2_governed_artist_intake_origin_v2 charts2_shazam_no_id_observation_review_v2; do
            if [ "$n" -gt 0 ]; then sleep 2; fi
            test "$(find supabase/migrations -maxdepth 1 -type f -name "*_${name}.sql" | wc -l | tr -d ' ')" -eq 0
            supabase migration new "$name"
            path="$(find supabase/migrations -maxdepth 1 -type f -name "*_${name}.sql" -print)"
            test -n "$path"
            test "$(printf '%s\n' "$path" | wc -l | tr -d ' ')" -eq 1
            version="$(basename "$path" | cut -d_ -f1)"
            test "${#version}" -eq 14
            test "$version" -gt 20261123062500
            printf 'CHARTS2_FORWARD_CLI_MIGRATION_%s=%s\n' "$n" "$path"
            n=$((n+1))
          done
          test "$n" -eq 3
          printf 'CHARTS2_FORWARD_CLI_MINT=PASS\n'
          printf 'NO_REMOTE_DATABASE_CONNECTION_OR_WRITE=TRUE\n'
