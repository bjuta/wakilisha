name: MIZIZI Authentic Source-First Preview Admission (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-preview-source-first-admit-once.yml"
permissions:
  contents: read
concurrency:
  group: mizizi-preview-authentic-source-first-admission
  cancel-in-progress: false
jobs:
  real-public-source-and-jit:
    if: github.event.pull_request.number == 1243 && github.event.pull_request.head.repo.full_name == 'bjuta/wakilisha'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIZIZI_PREVIEW_PROJECT_REF: nkgfoppunmnkcumalxqp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check exact Preview-only DB05 source intake proof
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$MIZIZI_PREVIEW_PROJECT_REF" = "nkgfoppunmnkcumalxqp"
          test ! -e supabase/.temp/project-ref
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('docs/engineering/replay-proofs/20261016092731_mizizi_external_wikidata_research_intake_v1.sql.json','utf8'));
          if(p.verifier!=='pass'||p.preview_project_ref!=='nkgfoppunmnkcumalxqp'||
             p.preview_migration_head!=='20261016092731'||p.schema_migration_count!==233||
             p.production_promotion!=='not_run')
            throw Error('STOP_MIZIZI_SOURCE_FIRST_PREVIEW_RECEIPT_NOT_ACCEPTED');
          console.log('MIZIZI_AUTHENTIC_SOURCE_PREVIEW_DB05_RECEIPT=PASS');
          NODE
      - name: Install exact Node client and trusted JIT dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch actual CC0 entity then admit case and job with real temporary JIT
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/acceptance/run-mizizi-wikidata-preview-jit-once.ts
