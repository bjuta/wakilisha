name: RNB18 Hosted Preview Canonical Type Seal (Evidence Only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rnb18-hosted-preview-schema-evidence.yml'

permissions:
  contents: read

concurrency:
  group: rnb18-hosted-preview-schema-evidence-1336
  cancel-in-progress: false

jobs:
  preview-schema-evidence:
    name: pinned-cli-public-editorial-types
    if: ${{ github.event.pull_request.number == 1336 && github.event.pull_request.head.repo.full_name == 'bjuta/wakilisha' && github.event.pull_request.head.ref == 'fix/wk100-rnb18-stage2-retirement-replay-20261102' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: uummbxewahdozsjkubez
      SUPABASE_TARGET_PROJECT_REF: pgzizndxdyhqmtyywjmt
      CONTROL_PLANE_BASE_REF: origin/main
      PREVIEW_BRANCH_UUID: c00bfe1e-fcc8-4a10-86b3-c2af1d249776
      MIGRATION: supabase/migrations/20261101210335_rnb18_stage1_archive_replay_authority_v1.sql
      VERIFIER: scripts/control-plane/verify-rnb18-stage1-replay-authority.sql

    steps:
      - name: Check out the exact PR source and main ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject wrong branch, wrong Git SHA, wrong migration chain, or absent token
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = fix/wk100-rnb18-stage2-retirement-replay-20261102
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test ! -e supabase/.temp/project-ref
          test -f "$MIGRATION"
          test -f "$VERIFIER"
          test ! -f supabase/migrations/20261030062819_retire_18_kenya_rnb_editions.sql
          test -f docs/engineering/replay-baseline/retired-active-migrations/20261030062819_retire_18_kenya_rnb_editions.sql
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 236
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -1 | sed 's#^.*/##')" = "$(basename "$MIGRATION")"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base HEAD refs/remotes/origin/main >/dev/null
          echo WK_RNB18_EXACT_STAGE2_236_FILE_SOURCE=PASS

      - name: Set up canonical pinned Supabase CLI 2.107.0
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Link strictly to the existing hosted Preview (never Production)
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = 2.107.0
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "$SUPABASE_TARGET_PROJECT_REF"
          echo WK_RNB18_EXISTING_HOSTED_PREVIEW_LINK=PASS

      - name: Generate official public,editorial types and pending authenticated proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/control-plane/record-migration-replay-proof.mjs \
            --migration "$MIGRATION" \
            --preview-project-ref "$SUPABASE_PROJECT_REF" \
            --preview-branch-id "$PREVIEW_BRANCH_UUID" \
            --verifier-file "$VERIFIER"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const proof = JSON.parse(fs.readFileSync('docs/engineering/replay-proofs/20261101210335_rnb18_stage1_archive_replay_authority_v1.sql.json','utf8'));
          const baseline = JSON.parse(fs.readFileSync('docs/engineering/live-schema-baseline.json','utf8'));
          const types = fs.readFileSync('src/types/database.types.ts','utf8');
          if (proof.baseline_replay !== 'pending' ||
              proof.schema_migration_count !== 236 ||
              proof.schema_migration_head !== '20261101210335' ||
              proof.preview_project_ref !== 'uummbxewahdozsjkubez' ||
              proof.preview_branch_id !== 'c00bfe1e-fcc8-4a10-86b3-c2af1d249776' ||
              baseline.schemaSeal?.mode !== 'preview' ||
              baseline.schema !== 'public,editorial' ||
              baseline.migrationCount !== 236 ||
              !types.includes('  public: {') || !types.includes('  editorial: {')) {
            throw new Error('STOP_RNB18_AUTHENTICATED_SCHEMA_SEAL_NOT_MATCHED');
          }
          console.log('WK_RNB18_PINNED_CLI_PUBLIC_EDITORIAL_236_PREVIEW_TYPE_PROOF_PENDING=PASS');
          NODE
          sha256sum src/types/database.types.ts
          sha256sum "$MIGRATION"

      - name: Preserve generated evidence without altering any Git branch
        uses: actions/upload-artifact@v4
        with:
          name: rnb18-stage2-preview-types-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src/types/database.types.ts
            docs/engineering/live-schema-baseline.json
            docs/engineering/replay-proofs/20261101210335_rnb18_stage1_archive_replay_authority_v1.sql.json
