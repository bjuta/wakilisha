name: Temporary Exact-Main URL Identity Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/tmp-url-identity-exact-main-preflight.yml"

permissions:
  contents: write

concurrency:
  group: mizizi-production-jit-control-plane
  cancel-in-progress: false

jobs:
  preflight:
    name: exact-main-read-only-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: 9a6cd5342fb829179a943bc2539c52188dd46b58
      SUPABASE_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIZIZI_CONTROL_PLANE_MODE: preflight
      MIZIZI_ARTIFACT_DIR: artifacts/mizizi-url-identity-exact-main-preflight
      TEMP_BRANCH: ops/tmp-url-identity-exact-main-preflight-1013

    steps:
      - name: Check out exact protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact protected main
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
          echo "URL_IDENTITY_EXACT_MAIN_PREFLIGHT_AUTHORITY=PASS"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run exact-main MIZIZI URL-identity preflight
        run: node scripts/control-plane/mizizi-url-identity-production-control-plane.mjs

      - name: Upload exact-main candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizizi-url-identity-exact-main-preflight
          path: artifacts/mizizi-url-identity-exact-main-preflight
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup temporary preflight branch
        if: always()
        run: |
          set -euo pipefail
          git push origin --delete "$TEMP_BRANCH" || true
