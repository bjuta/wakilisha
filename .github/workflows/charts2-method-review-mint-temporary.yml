name: Temporary Charts2 Source-Method Review Migration Mint
on:
  push:
    branches:
      - feat/charts2-governed-youtube-source-method-review
    paths:
      - .github/workflows/charts2-method-review-mint-temporary.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/charts2-method-review-mint-temporary.yml
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact forward migration filename with pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new charts2_governed_source_method_review_v1
          p="$(find supabase/migrations -maxdepth 1 -name '*_charts2_governed_source_method_review_v1.sql' -print | sort | tail -1)"
          test -n "$p"
          echo "CHARTS2_METHOD_REVIEW_MINTED_FILE=$p"
          echo "CHARTS2_METHOD_REVIEW_MINT=PASS"
