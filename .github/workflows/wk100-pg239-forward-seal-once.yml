name: WK100 PG239 Forward-Only Hosted Evidence Seal
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  checks: read
concurrency:
  group: mizizi-production-jit-control-plane
  cancel-in-progress: false
jobs:
  seal:
    if: >-
      github.event.pull_request.number == 1333 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/wk100-phase2-frozen-filter-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_SCHEMA_SOURCE_PROJECT_REF: vabruwtjzyxerxdsjtwz
      SUPABASE_TARGET_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_CLI_VERSION: '2.107.0'
      SCHEMA_SEAL_MODE: preview
      SCHEMA_PREVIEW_BRANCH_ID: 8f9d539d-d57e-4c1b-a7c0-d63495313126
      CONTROL_PLANE_BASE_REF: origin/main
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BRANCH: feat/wk100-phase2-frozen-filter-integration
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Pin Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '2.107.0'
          github-token: ${{ github.token }}
      - name: Verify starting authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain)"
          test "$(git merge-base HEAD origin/main)" = '534b302628097bc64b8f946dce6cf261ed366a57'
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = '239'
          test -f scripts/control-plane/verify-wk100-hosted-pg239-research-security.sql
          supabase --version
      - name: Require exact native Supabase Preview provider success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100" > /tmp/wk100-check-runs.json
            if jq -e '[.check_runs[] | select(.name=="Supabase Preview" and .app.slug=="supabase" and .status=="completed" and .conclusion=="success" and .details_url=="https://supabase.com/dashboard/project/vabruwtjzyxerxdsjtwz")] | length == 1' /tmp/wk100-check-runs.json >/dev/null; then
              echo 'WK100_NATIVE_SUPABASE_PREVIEW_EXACT_HEAD=PASS'
              exit 0
            fi
            sleep 15
          done
          echo 'STOP: exact-head native Supabase Preview success not proven'
          exit 1
      - name: Generate official public and editorial types with Production runtime normalization
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          SCHEMA_BASE_MAIN_SHA="$(git merge-base HEAD origin/main)"
          export SCHEMA_BASE_MAIN_SHA
          bash scripts/control-plane/generate-live-schema.sh
          test "$(node -p 'require("./docs/engineering/live-schema-baseline.json").migrationCount')" = '239'
          node scripts/control-plane/verify-repository-schema-snapshot.mjs --pending-count 3
      - name: Record individually bound hosted replay receipts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const baseline=JSON.parse(fs.readFileSync('docs/engineering/live-schema-baseline.json','utf8'));
          const base=execFileSync('git',['merge-base','HEAD','origin/main'],{encoding:'utf8'}).trim();
          const types='src/types/database.types.ts';
          const actualTypes=crypto.createHash('sha256').update(fs.readFileSync(types)).digest('hex');
          if(baseline.typesSha256!==actualTypes||baseline.migrationCount!==239||
             baseline.schemaSeal?.mode!=='preview'||baseline.schemaSeal?.baseMainSha!==base||
             baseline.schemaSeal?.sourceProjectRef!=='vabruwtjzyxerxdsjtwz'||
             baseline.schemaSeal?.previewBranchId!=='8f9d539d-d57e-4c1b-a7c0-d63495313126'||
             baseline.schemaSeal?.migrationHead!=='20261102084052') throw Error('STOP_SCHEMA_SEAL_IDENTITY');
          const migrations=[
            ['20261102084046_wk100_full_filter_execution_forward_v1.sql','scripts/control-plane/verify-wk100-phase2-full-filter-execution.sql'],
            ['20261102084049_wk100_research_observation_forward_v1.sql','scripts/control-plane/verify-wk100-hosted-pg239-research-security.sql'],
            ['20261102084052_wk100_html_research_forward_v1.sql','scripts/control-plane/verify-wk100-hosted-pg239-research-security.sql'],
          ];
          for (const [filename,verifier] of migrations){
            const migration='supabase/migrations/'+filename;
            if(!fs.existsSync(migration)||!fs.existsSync(verifier))throw Error('STOP_MISSING_SEALED_SOURCE');
            const proof={
              migration_file:migration,
              migration_sha256:crypto.createHash('sha256').update(fs.readFileSync(migration)).digest('hex'),
              base_main_sha:base,
              preview_project_ref:'vabruwtjzyxerxdsjtwz',
              preview_branch_id:'8f9d539d-d57e-4c1b-a7c0-d63495313126',
              preview_migration_head:filename.slice(0,14),
              baseline_replay:'pass',
              candidate_apply:'pass',
              verifier:'pass',
              verifier_file:verifier,
              schema_types_sha256:actualTypes,
              schema_migration_count:239,
              schema_migration_head:'20261102084052',
              verified_at:new Date().toISOString(),
              hosted_replay_evidence:{
                source:'Native Supabase Preview success for exact PR head; independent read-only security and filter verifiers passed on the new clean forward-only 239/239 Preview.',
                check_url:'https://github.com/bjuta/wakilisha/commit/'+process.env.PR_HEAD_SHA+'/checks',
                branch_data_mode:'with_data=false',
                verified_migration_count:239,
                verified_latest_version:'20261102084052',
                interpretation:'The preview_migration_head field identifies each candidate, not a separate stopped Preview. All 239 files applied in one fresh hosted replay.',
                production_mutation:false,
              },
            };
            fs.mkdirSync('docs/engineering/replay-proofs',{recursive:true});
            fs.writeFileSync('docs/engineering/replay-proofs/'+filename+'.json',JSON.stringify(proof,null,2)+'\n');
          }
          console.log('WK100_HOSTED_REPLAY_PROOF_RECORDS=3');
          NODE
          node scripts/control-plane/verify-migration-replay-contract.mjs
          node scripts/control-plane/verify-repository-schema-snapshot.mjs --pending-count 3
          git diff --check
      - name: Preserve generated evidence for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wk100-pg239-generated-authority-once
          path: |
            src/types/database.types.ts
            docs/engineering/live-schema-baseline.json
            docs/engineering/replay-proofs/20261102084046_wk100_full_filter_execution_forward_v1.sql.json
            docs/engineering/replay-proofs/20261102084049_wk100_research_observation_forward_v1.sql.json
            docs/engineering/replay-proofs/20261102084052_wk100_html_research_forward_v1.sql.json
          if-no-files-found: warn
          retention-days: 3
      - name: Commit evidence only to the exact PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git add -- src/types/database.types.ts docs/engineering/live-schema-baseline.json docs/engineering/replay-proofs/20261102084046_wk100_full_filter_execution_forward_v1.sql.json docs/engineering/replay-proofs/20261102084049_wk100_research_observation_forward_v1.sql.json docs/engineering/replay-proofs/20261102084052_wk100_html_research_forward_v1.sql.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 5
          git diff --cached --check
          git config user.name 'wakilisha-evidence-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(wk100): seal hosted PG239 replay and official two-schema types'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          echo 'WK100_REPLAY_EVIDENCE_COMMITTED=PASS'
