name: Temporary Charts 2.0 Private Freeze Migration Mint
on:
  push:
    branches:
      - feat/charts2-phase2-scoring-studio
    paths:
      - .github/workflows/charts2-freeze-mint-temporary.yml
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact Phase 2 private freeze migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new charts2_private_freeze_authority_v1
          p="$(find supabase/migrations -maxdepth 1 -name '*_charts2_private_freeze_authority_v1.sql' -print | sort | tail -1)"
          test -n "$p"
          echo "CHARTS2_FREEZE_MINTED_FILE=$p"
          echo "CHARTS2_FREEZE_MINT=PASS"
