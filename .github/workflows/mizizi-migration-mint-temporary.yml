name: MIZIZI Migration Filename Mint (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-migration-mint-temporary.yml"
permissions:
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Generate exact CLI-authoritative migration path
        run: |
          set -euo pipefail
          supabase migration new mizizi_research_pass_memory_v1
          find supabase/migrations -maxdepth 1 -name '*_mizizi_research_pass_memory_v1.sql' -print
          COUNT="$(find supabase/migrations -maxdepth 1 -name '*_mizizi_research_pass_memory_v1.sql' | wc -l | tr -d ' ')"
          test "$COUNT" = "1"
