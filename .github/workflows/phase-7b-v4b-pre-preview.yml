name: Phase 7B V4B Pre-Preview

on:
  push:
    branches:
      - feat/phase-7b-v4b-public-adaptive-video-playback

permissions:
  contents: read

concurrency:
  group: phase-7b-v4b-pre-preview
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check exact candidate diff
        run: |
          git diff --check bd1a238bbb8c35a0e858c633109621681911d7e3...HEAD

      - name: Enforce Primitive Compounding
        run: |
          node scripts/control-plane/verify-primitive-compounding.mjs
          npx vitest run test/control-plane/primitive-compounding.test.ts

      - name: Test Video primitive preservation and V4B
        run: |
          npx vitest run \
            test/video/phase-7b-v1-public-video-read-delivery.test.ts \
            test/video/phase-7b-v2-public-video-experience-convergence.test.ts \
            test/video/phase-7b-v4a-adaptive-video-media.test.ts \
            test/video/phase-7b-v4b-public-adaptive-video-playback.test.ts

      - name: Enforce public-copy punctuation
        run: |
          ! grep -n '—' \
            src/components/video/VideoPlaybackCanvas.tsx \
            src/components/video/PublicVideoWatchingSurface.tsx

      - name: Build application
        run: npm run build:app
