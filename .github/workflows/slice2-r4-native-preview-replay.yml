name: Slice 2 R4 Native Preview Replay

on:
  push:
    branches:
      - feat/music-ontology-slice2-authority-v1

permissions:
  contents: read

concurrency:
  group: slice2-r4-native-preview-replay
  cancel-in-progress: false

jobs:
  replay:
    if: "${{ github.event.head_commit.message == 'ci: apply slice2 r4 native candidate' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_REF: afihgsvgekjbsfgohcvz
      IMPLEMENTATION_SHA: 6b70940c11286bee691094abff727ccd1538d24d
      CANDIDATE: 20260923083943_music_identity_rights_slice2_authority_v1.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact implementation candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          fetch-depth: 0

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Link R4 Preview
        run: |
          set -euo pipefail
          supabase link --project-ref "$PREVIEW_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"

      - name: Require exact Slice 2 pending set
        run: |
          set -euo pipefail
          test -s "supabase/migrations/$CANDIDATE"

          DRY="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$DRY"

          ACTUAL="$(
            {
              printf '%s\n' "$DRY" |
                grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true
            } |
              sort -u
          )"

          test "$ACTUAL" = "$CANDIDATE"
          echo "SLICE2_R4_CANDIDATE_PENDING_SET=PASS"

      - name: Native apply exact Slice 2 migration
        run: |
          set -euo pipefail
          supabase db push --linked

          POST="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$POST"

          POST_PENDING="$(
            {
              printf '%s\n' "$POST" |
                grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true
            } |
              sort -u
          )"

          test -z "$POST_PENDING"
          echo "SLICE2_R4_NATIVE_CANDIDATE_APPLY=PASS"
