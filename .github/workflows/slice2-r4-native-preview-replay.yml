name: Slice 2 R4 Replay Proof Seal

on:
  push:
    branches:
      - feat/music-ontology-slice2-authority-v1

permissions:
  contents: write

concurrency:
  group: slice2-r4-replay-proof-seal
  cancel-in-progress: false

jobs:
  seal:
    if: "${{ github.event.head_commit.message == 'ci: seal slice2 r4 replay proof' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_REF: afihgsvgekjbsfgohcvz
      PREVIEW_BRANCH_ID: 9a6911dd-a1b4-446e-993a-33cd951219a1
      MIGRATION: supabase/migrations/20260923083943_music_identity_rights_slice2_authority_v1.sql
      VERIFIER: scripts/control-plane/verify-music-identity-rights-slice2-authority.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_CLI_VERSION: 2.107.0
      SUPABASE_TARGET_PROJECT_REF: pgzizndxdyhqmtyywjmt
      CONTROL_PLANE_BASE_REF: origin/main

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/music-ontology-slice2-authority-v1
          fetch-depth: 0

      - name: Fetch exact protected main authority
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          test -s "$MIGRATION"
          test -s "$VERIFIER"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Link exact R4 Preview
        run: |
          set -euo pipefail
          supabase link --project-ref "$PREVIEW_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"

      - name: Record canonical migration replay proof
        run: |
          set -euo pipefail
          node scripts/control-plane/record-migration-replay-proof.mjs \
            --migration "$MIGRATION" \
            --preview-project-ref "$PREVIEW_REF" \
            --preview-branch-id "$PREVIEW_BRANCH_ID" \
            --verifier-file "$VERIFIER"

      - name: Commit generated schema seal artifacts
        run: |
          set -euo pipefail

          PROOF="docs/engineering/replay-proofs/20260923083943_music_identity_rights_slice2_authority_v1.sql.json"

          test -s src/types/database.types.ts
          test -s docs/engineering/live-schema-baseline.json
          test -s "$PROOF"

          git status --short

          git add \
            src/types/database.types.ts \
            docs/engineering/live-schema-baseline.json \
            "$PROOF"

          test -n "$(git diff --cached --name-only)"

          git config user.name "WAKILISHA Replay Seal"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "chore: seal music ontology Slice 2 replay proof"
          git push origin HEAD:feat/music-ontology-slice2-authority-v1

          echo "SLICE2_R4_REPLAY_PROOF_SEAL=PASS"
