name: MIZIZI QV2 temporary CLI migration name
on:
  push:
    branches: [feat/mizizi-governed-question-freeze-v1]
    paths:
      - '.github/workflows/tmp-mizizi-governed-question-migration-mint.yml'
permissions:
  contents: read
jobs:
  cli-name:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no linked database context
        shell: bash
        run: |
          set -euo pipefail
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint filename with pinned CLI without applying SQL
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new mizizi_governed_question_freeze_v1
          test "$(find supabase/migrations -maxdepth 1 -name '*_mizizi_governed_question_freeze_v1.sql' | wc -l)" -eq 1
          echo "WK_MIZIZI_QV2_MINTED_PATH=$(find supabase/migrations -maxdepth 1 -name '*_mizizi_governed_question_freeze_v1.sql' | head -1)"
