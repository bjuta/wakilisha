name: Remint Provider Identity Release Migration

on:
  push:
    branches:
      - feat/provider-identity-release-strong-evidence-resolver
    paths:
      - .github/workflows/remint-provider-identity-release-migration.yml

permissions:
  contents: write

concurrency:
  group: remint-provider-identity-release-migration
  cancel-in-progress: false

jobs:
  remint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/provider-identity-release-strong-evidence-resolver

      - name: Require exact rebase head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "50894865632253d18af927b815aaad8c4e107329"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "7b55c59b9ca9f289c6f01677817cbfc4bde12033"
          echo "RELEASE_REMINT_BASE=PASS"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Mint replacement canonical migration
        shell: bash
        run: |
          set -euo pipefail

          OLD="supabase/migrations/20261007054605_provider_identity_release_strong_evidence_resolver_v1.sql"
          test -f "$OLD"

          OLD_BLOB="$(git hash-object "$OLD")"
          test "$OLD_BLOB" = "24a92421dd882d0ef432adfd44e30981057b6980"

          supabase migration new provider_identity_release_strong_evidence_resolver_v1

          NEW="$(
            find supabase/migrations -maxdepth 1 -type f               -name '*_provider_identity_release_strong_evidence_resolver_v1.sql'               ! -path "$OLD"               -print
          )"

          COUNT="$(printf '%s\n' "$NEW" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$COUNT" = "1"

          BASENAME="$(basename "$NEW")"
          VERSION="${BASENAME%%_*}"

          case "$VERSION" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "STOP: non-canonical generated migration: $BASENAME"; exit 1 ;;
          esac

          test "$VERSION" -gt "20261007075400"

          cp "$OLD" "$NEW"
          rm "$OLD"

          test "$(git hash-object "$NEW")" = "$OLD_BLOB"

          printf 'SUPERSEDED_MIGRATION=%s\n' "$OLD"
          printf 'CANONICAL_MIGRATION=%s\n' "$NEW"
          printf 'CANONICAL_VERSION=%s\n' "$VERSION"

      - name: Commit replacement path only
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            git status --short |
              awk '{print $2}' |
              grep -v '^.github/workflows/remint-provider-identity-release-migration.yml$' |
              sort
          )"

          NEW="$(
            find supabase/migrations -maxdepth 1 -type f               -name '*_provider_identity_release_strong_evidence_resolver_v1.sql'               ! -name '20261007054605_provider_identity_release_strong_evidence_resolver_v1.sql'               -print
          )"

          EXPECTED="$(
            printf '%s\n%s\n'               'supabase/migrations/20261007054605_provider_identity_release_strong_evidence_resolver_v1.sql'               "$NEW" |
              sort
          )"

          test "$CHANGED" = "$EXPECTED"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OLD" "$NEW"
          git commit -m "chore(identity): remint Release resolver migration after main advanced"
          git push origin HEAD:feat/provider-identity-release-strong-evidence-resolver

          echo "RELEASE_REMINT_COMMIT=PASS"
