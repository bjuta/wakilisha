name: Temporary MIZIZI Desk Convergence Migration Mint
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mizizi-desk-convergence-mint-temporary.yml
permissions:
  contents: read
jobs:
  mint:
    if: github.event.pull_request.number == 1442 && github.head_ref == 'work/mizizi-charts-candidate-resolution-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact migration filename in unlinked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cd5bd53c0bb65985fe7b18d44d83b80d52c721bd
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 292
          test ! -e supabase/.temp/project-ref
          test -z "$(find supabase/migrations -maxdepth 1 -name '*_mizizi_desk_operational_convergence.sql' -print)"
          supabase --version
          supabase migration new mizizi_desk_operational_convergence
          p="$(find supabase/migrations -maxdepth 1 -type f -name '*_mizizi_desk_operational_convergence.sql' -print)"
          test -f "$p"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = 293
          test "$(printf '%s\n' supabase/migrations/*.sql | sort | tail -1)" = "$p"
          echo "MIZIZI_DESK_CONVERGENCE_MINTED_FILE=$p"
          echo "MIZIZI_DESK_CONVERGENCE_MINT=PASS"
