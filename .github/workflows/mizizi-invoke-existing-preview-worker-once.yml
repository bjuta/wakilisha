name: MIZIZI Invoke Authenticated Preview Worker (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-invoke-existing-preview-worker-once.yml"
permissions:
  contents: read
concurrency:
  group: mizizi-existing-authentic-preview-worker-only
  queue: max
jobs:
  invoke-exact-queued-job:
    if: github.event.pull_request.number == 1243 && github.event.pull_request.head.repo.full_name == 'bjuta/wakilisha'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIZIZI_PREVIEW_PROJECT_REF: nkgfoppunmnkcumalxqp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Invoke one already admitted research job using existing Preview service JWT
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$MIZIZI_PREVIEW_PROJECT_REF" = "nkgfoppunmnkcumalxqp"
          test "$GITHUB_HEAD_REF" = "feat/mizizi-slice2-adaptive-multipass-investigation"
          KEY_FILE="$RUNNER_TEMP/mizizi-preview-ephemeral-api-key-inventory.json"
          umask 077
          trap 'rm -f "$KEY_FILE"' EXIT
          supabase projects api-keys --project-ref "$MIZIZI_PREVIEW_PROJECT_REF" -o json > "$KEY_FILE"
          node scripts/acceptance/invoke-mizizi-authentic-preview-worker-once.mjs "$KEY_FILE"
          echo "MIZIZI_PREVIEW_WORKER_REJECTION_CLASSIFICATION=COMPLETE"
