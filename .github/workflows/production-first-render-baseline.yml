name: Production First Render Baseline
on:
  push:
    branches:
      - audit/production-first-render-browser-baseline
    paths:
      - .github/workflows/production-first-render-baseline.yml
      - scripts/performance/probe-production-first-render.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Run read-only real browser baseline
        run: node scripts/performance/probe-production-first-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-first-render-baseline
          path: artifacts/performance/production-first-render.json
          if-no-files-found: warn
