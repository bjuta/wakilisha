name: Seal Slice 3 Release Label Preview R2

on:
  push:
    branches:
      - feat/music-metadata-slice3-release-label-admission-v1

permissions:
  contents: write

jobs:
  seal:
    if: "${{ github.event.head_commit.message == 'ci: seal slice3 release label preview r2' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: asqvcycvepuafbvrqafd
      SUPABASE_SCHEMA_SOURCE_PROJECT_REF: asqvcycvepuafbvrqafd
      SUPABASE_TARGET_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SCHEMA_SEAL_MODE: preview
      SCHEMA_BASE_MAIN_SHA: c210b8bcd0a45488d4b0f3d73b54df4340ba81ac
      SCHEMA_PREVIEW_BRANCH_ID: 0b47830d-a0e6-4dda-ac6a-2c6bd7e04ce8
      MIGRATION: supabase/migrations/20260923130246_music_identity_rights_slice3_release_label_admission_v1.sql
      PROOF: docs/engineering/replay-proofs/20260923130246_music_identity_rights_slice3_release_label_admission_v1.sql.json
      VERIFIER: scripts/control-plane/verify-music-metadata-release-label-admission-v1.sql

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Refresh exact protected main
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$SCHEMA_BASE_MAIN_SHA"

      - name: Generate Preview-sealed schema artifacts
        run: |
          set -euo pipefail
          bash scripts/control-plane/generate-live-schema.sh

      - name: Write exact replay proof
        run: |
          set -euo pipefail

          MIGRATION_SHA="$(sha256sum "$MIGRATION" | awk '{print $1}')"
          TYPES_SHA="$(sha256sum src/types/database.types.ts | awk '{print $1}')"
          MIGRATION_COUNT="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          MIGRATION_HEAD="20260923130246"
          VERIFIED_AT="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          export MIGRATION_SHA TYPES_SHA MIGRATION_COUNT MIGRATION_HEAD VERIFIED_AT

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const proof = {
            migration_file: process.env.MIGRATION,
            migration_sha256: process.env.MIGRATION_SHA,
            base_main_sha: process.env.SCHEMA_BASE_MAIN_SHA,
            preview_project_ref: process.env.SUPABASE_SCHEMA_SOURCE_PROJECT_REF,
            preview_branch_id: process.env.SCHEMA_PREVIEW_BRANCH_ID,
            preview_migration_head: process.env.MIGRATION_HEAD,
            baseline_replay: "pass",
            candidate_apply: "pass",
            verifier: "pass",
            verifier_file: process.env.VERIFIER,
            schema_types_sha256: process.env.TYPES_SHA,
            schema_migration_count: Number(process.env.MIGRATION_COUNT),
            schema_migration_head: process.env.MIGRATION_HEAD,
            verified_at: process.env.VERIFIED_AT,
          };

          fs.mkdirSync("docs/engineering/replay-proofs", { recursive: true });
          fs.writeFileSync(process.env.PROOF, JSON.stringify(proof, null, 2) + "\n");
          NODE

      - name: Enforce replay contract
        env:
          CONTROL_PLANE_BASE_REF: origin/main
        run: node scripts/control-plane/verify-migration-replay-contract.mjs

      - name: Run focused Slice 3 contracts
        run: |
          npx vitest run             test/registry/music-metadata-slice3-readonly-reports.test.ts             test/registry/music-metadata-slice3-external-identifier-admission.test.ts             test/registry/music-metadata-slice3-release-label-admission.test.ts

      - name: Commit durable seal and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/slice3-release-label-seal-r2-temp.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             src/types/database.types.ts             docs/engineering/live-schema-baseline.json             "$PROOF"             .github/workflows/slice3-release-label-seal-r2-temp.yml

          git commit -m "test: seal Slice 3 Release Label Preview"
          git push origin HEAD:feat/music-metadata-slice3-release-label-admission-v1
