name: MIZIZI QV3 Existing Preview One-File Apply (temporary)
on:
  pull_request:
    branches: [feat/mizizi-governed-question-freeze-v1]
    paths:
      - .github/workflows/mizizi-qv3-existing-preview-apply-temporary.yml
permissions:
  contents: read
concurrency:
  group: mizizi-qv3-existing-preview-one-file
  cancel-in-progress: false
jobs:
  exact-one-file-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_REF: nkgfoppunmnkcumalxqp
      PROD_REF: pgzizndxdyhqmtyywjmt
      Q_MIGRATION: 20261017212255_mizizi_source_family_attestation_v1.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require reviewed current branch and exact only Preview target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "feat/mizizi-source-family-attestation-v1"
          test "$GITHUB_BASE_REF" = "feat/mizizi-governed-question-freeze-v1"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          REMOTE="$(git ls-remote origin refs/heads/feat/mizizi-source-family-attestation-v1 | awk '{print $1}')"
          test "$REMOTE" = "$PR_HEAD_SHA"
          test "$PREVIEW_REF" = "nkgfoppunmnkcumalxqp"
          test "$PREVIEW_REF" != "$PROD_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test ! -e supabase/.temp/project-ref
          test -z "$(git status --porcelain)"
          test -f "supabase/migrations/$Q_MIGRATION"
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = 237
          echo WK_QV3_EXACT_HEAD_EXISTING_PREVIEW_SCOPE=PASS
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact repository Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independently fingerprint all existing Preview data before any link
        shell: bash
        run: WK_QV3_PHASE=before node scripts/control-plane/mizizi-qv3-preview-snapshot-temporary.mjs
      - name: Link only existing isolated Preview
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PREVIEW_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          echo WK_QV3_PREVIEW_LINK_LOCKED=PASS
      - name: Native dry-run must identify exactly QV3 as pending
        shell: bash
        run: |
          set -euo pipefail
          DRY="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$DRY"
          ACTUAL="$( { printf '%s\n' "$DRY" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true; } | sort -u )"
          test "$ACTUAL" = "$Q_MIGRATION" || { echo STOP_QV3_PREVIEW_PENDING_SET; exit 1; }
          echo WK_QV3_EXACT_ONE_PREVIEW_MIGRATION=PASS
      - name: Apply exactly one CLI-minted migration to isolated Preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          test "$PREVIEW_REF" != "$PROD_REF"
          supabase db push --linked
          echo WK_QV3_EXISTING_PREVIEW_NATIVE_ONE_FILE_PUSH=PASS
      - name: Prove 237 migration ledger and unchanged existing data
        shell: bash
        run: |
          set -euo pipefail
          WK_QV3_PHASE=after node scripts/control-plane/mizizi-qv3-preview-snapshot-temporary.mjs
          DRY="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$DRY"
          PENDING="$( { printf '%s\n' "$DRY" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true; } | sort -u )"
          test -z "$PENDING"
          echo WK_QV3_PREVIEW_237_ZERO_PENDING=PASS
