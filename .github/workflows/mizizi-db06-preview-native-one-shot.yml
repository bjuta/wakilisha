name: MIZIZI DB06 Native Preview One-Shot
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mizizi-db06-preview-native-one-shot.yml"

permissions:
  contents: read

concurrency:
  group: mizizi-db06-native-preview-one-shot
  cancel-in-progress: false

jobs:
  preview-db06:
    name: exact-one-file-native-preview-migration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_REF: nkgfoppunmnkcumalxqp
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EXPECTED_MIGRATION: 20261016114918_mizizi_research_job_retry_budget_v1.sql

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable scope, branch and Preview only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "bjuta/wakilisha"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_HEAD_REF" = "feat/mizizi-slice2-adaptive-multipass-investigation"
          test "$PREVIEW_REF" = "nkgfoppunmnkcumalxqp"
          test "$PREVIEW_REF" != "pgzizndxdyhqmtyywjmt"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -f "supabase/migrations/$EXPECTED_MIGRATION"
          test ! -e supabase/.temp/project-ref
          git fetch origin "refs/heads/$GITHUB_HEAD_REF:refs/remotes/origin/$GITHUB_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$GITHUB_HEAD_REF")"
          test -z "$(git status --porcelain)"
          echo MIZIZI_DB06_EXACT_PR_AND_PREVIEW=PASS

      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Link isolated Preview only
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PREVIEW_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          echo MIZIZI_DB06_PREVIEW_LINK=PASS

      - name: Require exactly the CLI-minted DB06 in native dry run
        shell: bash
        run: |
          set -euo pipefail
          DRY="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$DRY"
          ACTUAL="$(printf '%s\n' "$DRY" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' | sort -u)"
          if [ "$ACTUAL" != "$EXPECTED_MIGRATION" ]; then
            echo "STOP_MIZIZI_DB06_EXACT_PENDING_SET"
            exit 1
          fi
          echo MIZIZI_DB06_EXACT_PENDING=PASS

      - name: Native one-file push to linked isolated Preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          supabase db push --linked
          echo MIZIZI_DB06_PREVIEW_NATIVE_PUSH=PASS

      - name: Verify exact migration head and preserved original case
        shell: bash
        run: |
          set -euo pipefail
          POST="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$POST"
          PENDING="$( { printf '%s\n' "$POST" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true; } | sort -u )"
          test -z "$PENDING"
          node --input-type=module <<'NODE'
          const p="nkgfoppunmnkcumalxqp";
          const q="select "+
           "(select count(*)::int from supabase_migrations.schema_migrations) as n,"+
           "(select max(version) from supabase_migrations.schema_migrations) as head,"+
           "(select count(*)::int from mizizi_private.cases) as cases,"+
           "(select count(*)::int from mizizi_private.research_passes) as passes,"+
           "(select count(*)::int from public.registry_tracks) as tracks,"+
           "(select row_to_json(j) from (select id::text,status,attempt_count,max_attempts,command_receipt_id::text from platform_private.jobs "+
           "where id='27bf6fbf-7298-4004-8b66-301f52380ad5'::uuid) j) as job,"+
           "(select column_default from information_schema.columns where table_schema='platform_private' and table_name='jobs' and column_name='max_attempts') as default_attempts";
          const response=await fetch("https://api.supabase.com/v1/projects/"+p+"/database/query/read-only",{
           method:"POST",headers:{Authorization:"Bearer "+process.env.SUPABASE_ACCESS_TOKEN,
            "Content-Type":"application/json"},body:JSON.stringify({query:q}),
           signal:AbortSignal.timeout(20000)});
          if(!response.ok)throw Error("MIZIZI_DB06_READ_ONLY_VERIFICATION_HTTP_"+response.status);
          const payload=await response.json();
          const rows=Array.isArray(payload)?payload:(payload.result||payload.data);
          if(!Array.isArray(rows)||rows.length!==1)throw Error("MIZIZI_DB06_VERIFICATION_ROWS");
          const d=rows[0];
          if(d.n!==234||d.head!=="20261016114918"||d.cases!==1||d.passes!==2||
             d.tracks!==0||String(d.default_attempts)!=="5"||
             d.job?.id!=="27bf6fbf-7298-4004-8b66-301f52380ad5"||
             d.job?.status!=="succeeded"||Number(d.job?.attempt_count)!==5||
             Number(d.job?.max_attempts)!==25||
             d.job?.command_receipt_id!=="36b96c78-0bc2-4739-8b85-5ab173d40141")
           throw Error("MIZIZI_DB06_PREVIEW_STATE_DRIFT");
          console.log("MIZIZI_DB06_EXACT_PREVIEW_LEDGER_AND_CASE_PRESERVED=PASS");
          NODE
