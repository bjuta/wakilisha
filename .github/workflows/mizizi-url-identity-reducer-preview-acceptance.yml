name: Temporary MIZIZI URL Identity Reducer Preview Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-url-identity-reducer-preview-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: mizizi-production-jit-control-plane
  queue: max

jobs:
  reducer-preview:
    name: reducer-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: lscfgarfnhfqtohcdvmg
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Exercise reduction-only authority close through real JIT executor
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { openMiziziJitSession } from "./scripts/control-plane/mizizi-production-jit-runtime.mjs";

          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const grantId = "10130000-0000-4000-8000-000000000002";
          const operationKey = "registry.release_slug.canonicalize";

          const jit = await openMiziziJitSession({
            projectRef,
            managementProjectRef: "pgzizndxdyhqmtyywjmt",
            token,
          });

          try {
            const identity = await jit.pool.query(
              "select session_user,current_user",
            );

            const i = identity.rows[0];
            if (
              i.session_user !== "mizizi_executor" ||
              i.current_user !== "mizizi_executor"
            ) {
              throw new Error(
                "real JIT session is not mizizi_executor: " +
                  JSON.stringify(i),
              );
            }

            const close = await jit.pool.query(
              `
              select *
              from mizizi_private.close_stewardship_authority_window_v1(
                $1::text,
                $2::uuid,
                $3::text
              )
              `,
              [
                operationKey,
                grantId,
                "Disposable #1013 Preview reducer behavior acceptance",
              ],
            );

            if (close.rowCount !== 1) {
              throw new Error("Reducer did not return exactly one receipt");
            }

            const receipt = close.rows[0];
            if (
              receipt.operation_was_enabled !== true ||
              receipt.standing_grant_status !== "expired" ||
              Number(receipt.expired_exact_grants) !== 0
            ) {
              throw new Error(
                "Reducer receipt is not exact: " +
                  JSON.stringify(receipt),
              );
            }

            console.log(
              "MIZIZI_URL_IDENTITY_REDUCER_PREVIEW_BEHAVIOR=PASS",
            );
            console.log(JSON.stringify({ identity: i, receipt }));
          } finally {
            await jit.restore();
          }
          NODE
