name: Temporary MIZIZI URL Identity Reducer Preview Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-url-identity-reducer-preview-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: mizizi-production-jit-control-plane
  queue: max

jobs:
  reducer-preview:
    name: reducer-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: lscfgarfnhfqtohcdvmg
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Exercise reduction-only authority close through real JIT executor
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { openMiziziJitSession } from "./scripts/control-plane/mizizi-production-jit-runtime.mjs";

          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const grantId = "10130000-0000-4000-8000-000000000002";
          const operationKey = "registry.release_slug.canonicalize";

          const jit = await openMiziziJitSession({
            projectRef,
            managementProjectRef: "pgzizndxdyhqmtyywjmt",
            token,
          });

          try {
            const before = await jit.pool.query(
              `
              select
                session_user,
                current_user,
                (
                  select enabled
                  from platform_private.registry_operation_types
                  where operation_key=$1
                    and operation_version=1
                ) as operation_enabled,
                (
                  select status
                  from platform_private.system_actor_capability_grants
                  where id=$2::uuid
                ) as standing_status
              `,
              [operationKey, grantId],
            );

            const b = before.rows[0];
            if (b.session_user !== "mizizi_executor") {
              throw new Error("session_user is not mizizi_executor");
            }
            if (b.operation_enabled !== true || b.standing_status !== "active") {
              throw new Error("Preview reducer fixture is not exact at entry");
            }

            const close = await jit.pool.query(
              `
              select *
              from mizizi_private.close_stewardship_authority_window_v1(
                $1::text,
                $2::uuid,
                $3::text
              )
              `,
              [
                operationKey,
                grantId,
                "Disposable #1013 Preview reducer behavior acceptance",
              ],
            );

            if (close.rowCount !== 1) {
              throw new Error("Reducer did not return exactly one receipt");
            }

            const receipt = close.rows[0];
            if (
              receipt.operation_was_enabled !== true ||
              receipt.standing_grant_status !== "expired" ||
              Number(receipt.expired_exact_grants) !== 0
            ) {
              throw new Error("Reducer receipt is not exact: " + JSON.stringify(receipt));
            }

            const after = await jit.pool.query(
              `
              select
                (
                  select enabled
                  from platform_private.registry_operation_types
                  where operation_key=$1
                    and operation_version=1
                ) as operation_enabled,
                (
                  select status
                  from platform_private.system_actor_capability_grants
                  where id=$2::uuid
                ) as standing_status,
                (
                  select count(*)::int
                  from platform_private.registry_execution_grants
                  where system_actor_capability_grant_id=$2::uuid
                    and status='active'
                    and consumed_at is null
                    and revoked_at is null
                ) as active_exact_children,
                (
                  select count(*)::int
                  from public.registry_audit_log
                  where action='close_mizizi_stewardship_authority_window'
                    and entity_id=$2::uuid
                ) as close_audit_events
              `,
              [operationKey, grantId],
            );

            const a = after.rows[0];
            if (
              a.operation_enabled !== false ||
              a.standing_status !== "expired" ||
              Number(a.active_exact_children) !== 0 ||
              Number(a.close_audit_events) !== 1
            ) {
              throw new Error("Reducer postconditions failed: " + JSON.stringify(a));
            }

            console.log("MIZIZI_URL_IDENTITY_REDUCER_PREVIEW_BEHAVIOR=PASS");
            console.log(JSON.stringify({ receipt, after: a }));
          } finally {
            await jit.restore();
          }
          NODE
