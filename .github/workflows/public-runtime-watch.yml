name: Public Runtime Watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runtime-watch
  cancel-in-progress: true

jobs:
  public-runtime:
    name: public-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Require Supabase control-plane access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is required."
            exit 1
          fi

      - name: Resolve anonymous production credentials
        run: |
          npx --yes supabase@2.107.0 projects api-keys \
            --project-ref "$SUPABASE_PROJECT_REF" \
            -o json \
            > /tmp/supabase-api-keys.json

          ANON_KEY="$(
            node \
              scripts/control-plane/resolve-supabase-anon-key.mjs \
              /tmp/supabase-api-keys.json
          )"

          if [ -z "$ANON_KEY" ]; then
            echo "Could not resolve the public Supabase API key."
            exit 1
          fi

          echo "::add-mask::$ANON_KEY"
          echo "VITE_PUBLIC_SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Probe signed-out public data and Edge runtime
        run: >-
          npx vitest run
          test/security/public-anon-content.test.ts
          test/security/public-edge-runtime.test.ts
