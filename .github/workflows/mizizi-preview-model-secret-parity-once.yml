name: MIZIZI Preview Model Secret Parity (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-preview-model-secret-parity-once.yml"
permissions:
  contents: read
jobs:
  read-only-secret-name-proof:
    if: github.event.pull_request.number == 1243 && github.event.pull_request.head.repo.full_name == 'bjuta/wakilisha'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Verify model secret names in Production and isolated Preview without values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "MIZIZI_SUPABASE_MANAGEMENT_AUTHORITY=ABSENT"; exit 1; }
          supabase secrets list --project-ref pgzizndxdyhqmtyywjmt --output json > "$RUNNER_TEMP/prod-names.json"
          supabase secrets list --project-ref nkgfoppunmnkcumalxqp --output json > "$RUNNER_TEMP/preview-names.json"
          node - "$RUNNER_TEMP/prod-names.json" "$RUNNER_TEMP/preview-names.json" <<'NODE'
          const fs=require('node:fs');
          const [prod,preview]=process.argv.slice(2).map(x=>JSON.parse(fs.readFileSync(x,'utf8')));
          const list=v=>new Set((Array.isArray(v)?v:(v.secrets||v.result||[])).map(x=>String(x.name||x.NAME||'')));
          const p=list(prod),v=list(preview);
          for(const k of ['ANTHROPIC_API_KEY','INSTITUTE_ASSISTANT_MODEL']){
            console.log('MIZIZI_'+k+'_PRODUCTION='+(p.has(k)?'PRESENT':'ABSENT'));
            console.log('MIZIZI_'+k+'_PREVIEW='+(v.has(k)?'PRESENT':'ABSENT'));
          }
          console.log('MIZIZI_MODEL_SECRET_PARITY_PROOF=COMPLETE_NAMES_ONLY');
          NODE
          rm -f "$RUNNER_TEMP/prod-names.json" "$RUNNER_TEMP/preview-names.json"
