name: MIZIZI Slice 2 Exact Preview Apply (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-slice2-preview-exact-once.yml"
permissions:
  contents: write
concurrency:
  group: mizizi-slice2-existing-preview-exact-migration
  cancel-in-progress: false
jobs:
  preview-proof:
    if: github.event.pull_request.number == 1243 && github.event.pull_request.head.repo.full_name == 'bjuta/wakilisha'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PREVIEW_REF: nkgfoppunmnkcumalxqp
      PRODUCTION_REF: pgzizndxdyhqmtyywjmt
      MIGRATION: 20261016064245_mizizi_research_pass_memory_v1.sql
      PREVIEW_BRANCH_ID: 8c0affc1-b43b-44ac-b2eb-66715ed40252
      MIGRATION_VERIFIER: scripts/control-plane/verify-mizizi-db04-research-pass-v1.sql
    steps:
      - name: Check out exact same-repository PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Validate no linked Production and pinned migration candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$PREVIEW_REF" != "$PRODUCTION_REF"
          test "$PREVIEW_REF" = "nkgfoppunmnkcumalxqp"
          test ! -e supabase/.temp/project-ref
          test -s "supabase/migrations/$MIGRATION"
          test -s "$MIGRATION_VERIFIER"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${{ github.head_ref }}"
          test "$(git merge-base HEAD origin/main)" = "aed0323cb3baa34313dede0d5d08b8af35c4f7a7"
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Link exact existing isolated Preview
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            timeout 90s supabase link --project-ref "$PREVIEW_REF" --password "$SUPABASE_DB_PASSWORD"
          else
            timeout 90s supabase link --project-ref "$PREVIEW_REF"
          fi
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          echo "MIZIZI_EXISTING_PREVIEW_LINK_ONLY=PASS"
      - name: Enforce single expected forward migration before apply
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --dry-run > "$RUNNER_TEMP/mizizi-dry-run.log" 2>&1
          cat "$RUNNER_TEMP/mizizi-dry-run.log"
          grep -F "$MIGRATION" "$RUNNER_TEMP/mizizi-dry-run.log"
          test "$(grep -Ec '^.*202[0-9]{11}.*\.sql' "$RUNNER_TEMP/mizizi-dry-run.log" || true)" -eq 1
          echo "MIZIZI_PREVIEW_ONE_PENDING_MIGRATION_ONLY=PASS"
      - name: Apply exactly reviewed candidate to isolated Preview (never Production)
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          supabase db push --yes
          supabase migration list --linked
          DRY="$(supabase db push --dry-run 2>&1)"
          echo "$DRY"
          if printf '%s\n' "$DRY" | grep -F "$MIGRATION"; then
            echo "STOP: candidate still pending after Preview push" >&2
            exit 1
          fi
          echo "MIZIZI_EXACT_PREVIEW_FORWARD_APPLY=PASS"
      - name: Generate exact linked-Preview types, baseline, and pending proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/control-plane/record-migration-replay-proof.mjs \
            --migration "supabase/migrations/$MIGRATION" \
            --preview-project-ref "$PREVIEW_REF" \
            --preview-branch-id "$PREVIEW_BRANCH_ID" \
            --verifier-file "$MIGRATION_VERIFIER"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='docs/engineering/replay-proofs/20261016064245_mizizi_research_pass_memory_v1.sql.json';
          const p=JSON.parse(fs.readFileSync(path,'utf8'));
          p.verifier='pending';
          p.baseline_replay='pass';
          p.disposable_baseline_evidence='https://github.com/bjuta/wakilisha/actions/runs/38865571437';
          p.production_promotion='not_run';
          p.note='Isolated Preview only. Independent SQL verifier must be executed separately before changing verifier to pass.';
          fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          NODE
          git diff --check
      - name: Capture generated replay evidence before any push
        uses: actions/upload-artifact@v4
        with:
          name: mizizi-db04-exact-preview-evidence
          path: |
            src/types/database.types.ts
            docs/engineering/live-schema-baseline.json
            docs/engineering/replay-proofs/20261016064245_mizizi_research_pass_memory_v1.sql.json
      - name: Commit only generated proof files back to current branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          git add -- src/types/database.types.ts docs/engineering/live-schema-baseline.json \
            docs/engineering/replay-proofs/20261016064245_mizizi_research_pass_memory_v1.sql.json
          git diff --cached --check
          git diff --cached --name-only
          git -c user.name='WAKILISHA CI' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "docs(mizizi): retain linked Preview DB04 baseline pending independent verifier"
          git push origin HEAD:${{ github.head_ref }}
