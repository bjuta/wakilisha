name: Ch25 WebKit Buffer Architecture Proof (isolated)

on:
  push:
    branches:
      - experiment/ch25-webkit-buffer-mix-proof-20261028
    paths:
      - .github/workflows/ch25-webkit-buffer-proof.yml
      - test/ui-browser/ch25-webkit-buffer-mixer-proof.spec.ts
      - playwright.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ch25-webkit-buffer-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-buffer-architecture:
    name: Real WebKit two-buffer PCM proof (no remote mutations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Check out experimental branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert branch isolation and no secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/ch25-webkit-buffer-mix-proof-20261028"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          echo CH25_TEST_RUNNER_ISOLATED=PASS

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install genuine Playwright WebKit and OS libraries
        run: npx playwright install --with-deps webkit

      - name: Prove two decoded AudioBufferSourceNode streams on WebKit iPhone profile
        run: |
          npm run test:ui-browser -- \
            --project=webkit-buffer-architecture \
            --grep="Chapter 25 buffer-mixer proof"

      - name: Preserve evidence even if proof fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch25-webkit-buffer-proof-evidence
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
