name: Reseal Production Database Types

on:
  push:
    branches:
      - fix/chart-research-retirement-production-types-seal
    paths:
      - .github/workflows/reseal-production-database-types.yml

permissions:
  contents: write

concurrency:
  group: reseal-production-database-types
  cancel-in-progress: false

jobs:
  reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/chart-research-retirement-production-types-seal

      - name: Require exact Production-retirement base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "c30a0e89bd5c81b0047a7de98cb08aecd0c8be08"
          test "$(git rev-parse origin/main)" = "c30a0e89bd5c81b0047a7de98cb08aecd0c8be08"
          echo "TYPE_RESEAL_BASE=PASS"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Generate canonical Production types and baseline
        shell: bash
        run: |
          set -euo pipefail

          supabase gen types typescript             --project-id "$PROD_REF"             --schema public,editorial             > src/types/database.types.ts

          grep -F 'editorial: {' src/types/database.types.ts
          grep -F 'public: {' src/types/database.types.ts
          ! grep -F 'chart_research_windows' src/types/database.types.ts
          ! grep -F 'chart_research_observations' src/types/database.types.ts

          TYPES_SHA256="$(sha256sum src/types/database.types.ts | awk '{print $1}')"
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          node -e '
            const fs = require("fs");
            const [typesSha256, generatedAt] = process.argv.slice(1);
            const path = "docs/engineering/live-schema-baseline.json";
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            data.generatedAt = generatedAt;
            data.typesSha256 = typesSha256;
            data.migrationCount = 208;
            data.latestMigration = "20261007075400_chart_research_programme_retirement_v1.sql";
            data.schemaSeal = {
              mode: "production",
              sourceProjectRef: "pgzizndxdyhqmtyywjmt",
              migrationHead: "20261007075400"
            };
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          ' "$TYPES_SHA256" "$GENERATED_AT"

          git diff --check
          node scripts/control-plane/verify-repository-schema-snapshot.mjs --pending-count 0

          echo "TYPES_SHA256=$TYPES_SHA256"
          echo "TYPE_RESEAL_GENERATION=PASS"

      - name: Commit canonical Production schema seal
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            git status --short |
              awk '{print $2}' |
              sort
          )"

          EXPECTED="$(
            printf '%s\n%s\n'               'docs/engineering/live-schema-baseline.json'               'src/types/database.types.ts' |
              sort
          )"

          test "$CHANGED" = "$EXPECTED"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             docs/engineering/live-schema-baseline.json             src/types/database.types.ts

          git commit -m "chore(db): seal Production database schema"
          git push origin HEAD:fix/chart-research-retirement-production-types-seal

          echo "TYPE_RESEAL_COMMIT=PASS"
