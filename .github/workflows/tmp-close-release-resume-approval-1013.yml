name: Temporary Close Release Resume Approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/tmp-close-release-resume-approval-1013.yml"

permissions:
  contents: read

concurrency:
  group: mizizi-production-jit-control-plane
  queue: max

jobs:
  close-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Close exact Release resume approval window
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            openMiziziJitSession,
          } from "./scripts/control-plane/mizizi-production-jit-runtime.mjs";

          const jit = await openMiziziJitSession({
            projectRef: "pgzizndxdyhqmtyywjmt",
            token: process.env.SUPABASE_ACCESS_TOKEN,
          });

          try {
            const identity = await jit.pool.query(
              "select session_user,current_user"
            );

            const row = identity.rows[0];

            if (
              row.session_user !== "mizizi_executor" ||
              row.current_user !== "mizizi_executor"
            ) {
              throw new Error(
                "Reducer JIT identity is not mizizi_executor: " +
                  JSON.stringify(row)
              );
            }

            const result = await jit.pool.query(
              `
              select *
              from mizizi_private.close_stewardship_authority_window_v1(
                $1::text,
                $2::uuid,
                $3::text
              )
              `,
              [
                "registry.release_slug.canonicalize",
                "5370b846-6523-4139-b6f7-883f50c4a011",
                "#1013 close fresh approval after protected PR preflight exposed zero-at-rest sequencing contradiction"
              ]
            );

            if (result.rowCount !== 1) {
              throw new Error(
                "Authority reducer did not return exactly one receipt"
              );
            }

            console.log(
              "MIZIZI_RELEASE_RESUME_APPROVAL_CLOSE_PASS"
            );
            console.log(JSON.stringify({
              identity: row,
              receipt: result.rows[0],
            }));
          } finally {
            await jit.restore();
          }
          NODE
