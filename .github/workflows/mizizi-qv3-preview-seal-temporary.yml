name: MIZIZI QV3 Preview Schema Seal (temporary)
on:
  pull_request:
    branches: [feat/mizizi-governed-question-freeze-v1]
    paths:
      - .github/workflows/mizizi-qv3-preview-seal-temporary.yml
permissions:
  contents: write
concurrency:
  group: mizizi-qv3-preview-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_REF: nkgfoppunmnkcumalxqp
      PROD_REF: pgzizndxdyhqmtyywjmt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      HEAD_BRANCH: feat/mizizi-source-family-attestation-v1
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Verify exact prior accepted Preview authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "$HEAD_BRANCH"
          test "$GITHUB_BASE_REF" = "feat/mizizi-governed-question-freeze-v1"
          test "$PREVIEW_REF" != "$PROD_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/$HEAD_BRANCH | awk '{print $1}')" = "$EXPECTED_SHA" || { echo STOP_QV3_HEAD_ADVANCED; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN"
          test ! -e supabase/.temp/project-ref
          test -z "$(git status --porcelain)"
          test -f supabase/migrations/20261017212255_mizizi_source_family_attestation_v1.sql
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = 237
          test -f docs/engineering/mizizi-qv3-human-source-attestation-20261017.md
          echo WK_QV3_SEAL_EXACT_SOURCE=PASS
      - name: Link and verify already accepted migration, never apply
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PREVIEW_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PREVIEW_REF"
          DRY="$(supabase db push --dry-run --linked 2>&1)"
          printf '%s\n' "$DRY"
          PENDING="$( { printf '%s\n' "$DRY" | grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+\.sql' || true; } | sort -u )"
          test -z "$PENDING"
          echo WK_QV3_SEAL_PREVIEW_237_ZERO_PENDING=PASS
      - name: Generate exact types and sealed replay evidence
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_PLANE_BASE_REF=origin/main SUPABASE_CLI_VERSION=2.107.0 node scripts/control-plane/record-migration-replay-proof.mjs \
            --migration supabase/migrations/20261017212255_mizizi_source_family_attestation_v1.sql \
            --preview-project-ref "$PREVIEW_REF" \
            --preview-branch-id "8c0affc1-b43b-44ac-b2eb-66715ed40252" \
            --verifier-file scripts/control-plane/verify-mizizi-question-source-attestations-v1.sql
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const f="docs/engineering/replay-proofs/20261017212255_mizizi_source_family_attestation_v1.sql.json";
          const obj=JSON.parse(fs.readFileSync(f,"utf8"));
          if(obj.candidate_apply!=="pass"||obj.verifier!=="pass"||
            obj.schema_migration_count!==237||obj.schema_migration_head!=="20261017212255")
            throw Error("STOP_QV3_GENERATED_RECEIPT_DRIFT");
          // The isolated full 237-migration replay and two real-JWT suites
          // succeeded before the linked Preview native migration was promoted.
          obj.baseline_replay="pass";
          obj.disposable_baseline_evidence="https://github.com/bjuta/wakilisha/actions/runs/39071539232";
          obj.native_preview_cli_evidence="https://github.com/bjuta/wakilisha/actions/runs/39071985658";
          obj.independent_preview_verifier_evidence="Connected read-only QV3 SQL verifier after accepted 237-head native Preview push.";
          obj.production_promotion="not_run";
          fs.writeFileSync(f,JSON.stringify(obj,null,2)+"\n");
          NODE
          node scripts/control-plane/verify-migration-replay-contract.mjs
          echo WK_QV3_PREVIEW_SCHEMA_TYPES_AND_REPLAY_SEAL_PASS
      - name: Commit only generated schema snapshot and replay receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.types.ts docs/engineering/live-schema-baseline.json docs/engineering/replay-proofs/20261017212255_mizizi_source_family_attestation_v1.sql.json
          git diff --cached --quiet && { echo STOP_QV3_SCHEMA_SEAL_UNCHANGED; exit 1; }
          git commit -m "docs(mizizi): seal QV3 Preview 237 types and verified replay"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
