name: Temporary Charts 2.0 Top 100 Origin Integrity Migration Mint

on:
  push:
    branches:
      - feat/charts2-phase3-top100-origin-neutral-integrity
    paths:
      - .github/workflows/charts2-top100-origin-integrity-mint-temporary.yml

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Mint exact prospective Top 100 integrity migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new charts2_top100_origin_neutral_integrity_v1
          p="$(find supabase/migrations -maxdepth 1 -name '*_charts2_top100_origin_neutral_integrity_v1.sql' -print | sort | tail -1)"
          test -n "$p"
          echo "CHARTS2_ORIGIN_INTEGRITY_MINTED_FILE=$p"
          echo "CHARTS2_ORIGIN_INTEGRITY_MINT=PASS"
