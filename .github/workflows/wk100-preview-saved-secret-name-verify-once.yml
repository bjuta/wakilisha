name: WK100 Preview Saved Settings Presence (One Time)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.event.pull_request.number == 1333 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/wk100-phase2-frozen-filter-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.107.0'
          github-token: ${{ github.token }}
      - name: Read exact Preview secret names without exposing values
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          umask 077
          if ! supabase secrets list --project-ref vabruwtjzyxerxdsjtwz --output json > /tmp/wk100-preview-secrets.json 2>/tmp/wk100-preview-secrets.err; then
            echo 'STOP_PREVIEW_SECRETS_LIST'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const obj=JSON.parse(fs.readFileSync('/tmp/wk100-preview-secrets.json','utf8'));
          const items=Array.isArray(obj)?obj:Array.isArray(obj?.secrets)?obj.secrets:Array.isArray(obj?.result)?obj.result:null;
          if(!items)throw Error('STOP_UNRECOGNIZED_SECRET_LIST');
          const names=new Set();
          for(const item of items) {
            if(typeof item?.name!=='string'||names.has(item.name))throw Error('STOP_SECRET_NAME_SHAPE');
            names.add(item.name);
          }
          const expected=['WK100_RESEARCH_INTAKE_ENABLED','WK100_HTML_RESEARCH_INTAKE_ENABLED','WK100_RESEARCH_INTAKE_PROJECT_REF'];
          for(const key of expected) {
            if(!names.has(key))throw Error('STOP_MISSING_PREVIEW_SETTING_'+key);
            console.log('PREVIEW_SETTING_NAME_PRESENT='+key);
          }
          for(const key of ['SUPABASE_URL','SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY']) {
            if(!names.has(key))throw Error('STOP_MISSING_PREVIEW_BUILTIN_'+key);
          }
          console.log('WK100_PREVIEW_SAVED_SETTING_NAMES=PASS');
          console.log('WK100_SECRET_VALUE_READBACK=NOT_ATTESTED');
          console.log('WK100_PRODUCTION_SECRET_MUTATIONS=NONE');
          NODE
          rm -f /tmp/wk100-preview-secrets.json /tmp/wk100-preview-secrets.err
