name: MIZIZI Branch JIT Scope Inspection (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/mizizi-branch-jit-scope-once.yml"
permissions:
  contents: read
jobs:
  inspect-authority:
    if: github.event.pull_request.number == 1243 && github.event.pull_request.head.repo.full_name == 'bjuta/wakilisha'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Inspect base JIT state and base and branch mappings, without mutations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const parent='pgzizndxdyhqmtyywjmt';
          const branch='nkgfoppunmnkcumalxqp';
          const token=process.env.SUPABASE_ACCESS_TOKEN||'';
          if(!token)throw Error('STOP_MANAGEMENT_TOKEN_NOT_CONFIGURED');
          const read=async(path)=>{
            const r=await fetch('https://api.supabase.com'+path,{
              method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
            if(!r.ok)throw Error('STOP_JIT_READ_'+path.split('/').pop()+'_STATUS_'+r.status);
            return r.json();
          };
          const status=await read('/v1/projects/'+parent+'/jit-access');
          const state=String(status.state||status.data?.state||status.config?.state||'').toLowerCase();
          if(!['enabled','disabled'].includes(state))throw Error('STOP_UNKNOWN_BASE_JIT_STATE');
          const inventory=await read('/v1/projects/'+parent+'/database/jit/list');
          const entries=Array.isArray(inventory)?inventory:
            (inventory.items||inventory.data||inventory.mappings||inventory.users||[]);
          if(!Array.isArray(entries))throw Error('STOP_UNVERIFIED_JIT_INVENTORY');
          const roles=entries.flatMap(x=>Array.isArray(x.user_roles)?x.user_roles:[]);
          const active=roles.filter(r=>!r.expires_at||Number(r.expires_at)>Date.now());
          const unrestricted=active.filter(r=>r.branches_only!==true);
          console.log('MIZIZI_BASE_JIT_STATE='+state.toUpperCase());
          console.log('MIZIZI_BASE_JIT_MAPPED_USERS='+entries.length);
          console.log('MIZIZI_BASE_JIT_ACTIVE_ROLES='+active.length);
          console.log('MIZIZI_BASE_JIT_UNRESTRICTED_ACTIVE_ROLES='+unrestricted.length);
          try {
            const self=await read('/v1/projects/'+branch+'/database/jit');
            const rs=Array.isArray(self.user_roles)?self.user_roles:[];
            console.log('MIZIZI_BRANCH_JIT_SELF_ROLE_COUNT='+rs.length);
          } catch(e) {
            console.log('MIZIZI_BRANCH_JIT_SELF_ROLE_QUERY=NOT_AVAILABLE');
          }
          console.log('MIZIZI_BRANCH_JIT_READ_ONLY_INSPECTION=PASS');
          NODE
