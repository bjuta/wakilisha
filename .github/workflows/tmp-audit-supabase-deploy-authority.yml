name: Temporary Audit Supabase Deployment Authority

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/tmp-audit-supabase-deploy-authority.yml"

permissions:
  contents: read

jobs:
  audit:
    name: read-only-deployment-authority-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_REF: pgzizndxdyhqmtyywjmt
      ORG_SLUG: irkpyafjfgityrsbcisq

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Fetch Supabase GitHub connection and action runs
        run: |
          set -euo pipefail

          AUTH="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

          curl -fsS             -H "$AUTH"             -H 'Accept: application/json'             "https://api.supabase.com/v2/organizations/$ORG_SLUG/integrations/github/connections?filter%5Bproject_ref%5D=$PROD_REF&page%5Bsize%5D=100"             > /tmp/github-connections.json

          curl -fsS             -H "$AUTH"             -H 'Accept: application/json'             "https://api.supabase.com/v1/projects/$PROD_REF/actions?offset=0&limit=100"             > /tmp/action-runs.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const conn=JSON.parse(fs.readFileSync("/tmp/github-connections.json","utf8"));
          const runs=JSON.parse(fs.readFileSync("/tmp/action-runs.json","utf8"));

          const sanitizedConnections=(conn.data||[]).map((x)=>({
            id:x.id,
            inserted_at:x.attributes?.inserted_at,
            updated_at:x.attributes?.updated_at,
            workdir:x.attributes?.workdir,
            supabase_changes_only:x.attributes?.supabase_changes_only,
            branch_limit:x.attributes?.branch_limit,
            new_branch_per_pr:x.attributes?.new_branch_per_pr,
            project_ref:x.attributes?.project?.ref,
            project_name:x.attributes?.project?.name,
            repository_name:x.attributes?.repository?.name,
          }));

          const windowStart=Date.parse("2026-09-22T15:20:00Z");
          const windowEnd=Date.parse("2026-09-22T15:45:00Z");

          const relevantRuns=(Array.isArray(runs)?runs:[]).filter((run)=>{
            const t=Date.parse(run.created_at||"");
            return Number.isFinite(t) && t>=windowStart && t<=windowEnd;
          }).map((run)=>({
            id:run.id,
            branch_id:run.branch_id,
            check_run_id:run.check_run_id,
            created_at:run.created_at,
            updated_at:run.updated_at,
            workdir:run.workdir,
            git_config:run.git_config,
            run_steps:(run.run_steps||[]).map((s)=>({
              name:s.name,
              status:s.status,
              created_at:s.created_at,
              updated_at:s.updated_at,
            })),
          }));

          console.log("=== GITHUB CONNECTION ===");
          console.log(JSON.stringify(sanitizedConnections,null,2));
          console.log("=== ACTION RUNS 15:20-15:45Z ===");
          console.log(JSON.stringify(relevantRuns,null,2));

          fs.writeFileSync(
            "supabase-deployment-authority-audit.json",
            JSON.stringify({
              github_connections:sanitizedConnections,
              action_runs:relevantRuns
            },null,2)+"\n"
          );
          NODE

      - name: Query Production Postgres logs for migration actor
        run: |
          set -euo pipefail

          AUTH="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

          SQL="select
            timestamp,
            log_attributes['parsed.session_id'] as session_id,
            log_attributes['parsed.user_name'] as user_name,
            log_attributes['parsed.application_name'] as application_name,
            log_attributes['parsed.query'] as query,
            event_message
          from logs
          where source = 'postgres_logs'
            and (
              match(event_message, '(?i)20260922143000|close_stewardship_authority_window_v1|schema_migrations|AUDIT:.*DDL|CREATE FUNCTION|ALTER FUNCTION|GRANT EXECUTE|REVOKE')
              or match(log_attributes['parsed.query'], '(?i)20260922143000|close_stewardship_authority_window_v1|schema_migrations|CREATE FUNCTION|ALTER FUNCTION|GRANT EXECUTE|REVOKE')
            )
          order by timestamp asc
          limit 1000"

          curl -fsS -G             -H "$AUTH"             -H 'Accept: application/json'             --data-urlencode "sql=$SQL"             --data-urlencode 'iso_timestamp_start=2026-09-22T15:30:00Z'             --data-urlencode 'iso_timestamp_end=2026-09-22T15:35:00Z'             "https://api.supabase.com/v1/projects/$PROD_REF/analytics/endpoints/logs"             > /tmp/postgres-migration-logs.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const raw=JSON.parse(fs.readFileSync("/tmp/postgres-migration-logs.json","utf8"));
          const rows=Array.isArray(raw.result)?raw.result:[];

          const clean=rows.map((row)=>({
            timestamp:row.timestamp,
            session_id:row.session_id || null,
            user_name:row.user_name || null,
            application_name:row.application_name || null,
            query:(row.query || "").slice(0,4000),
            event_message:(row.event_message || "").slice(0,4000),
          }));

          console.log("=== PRODUCTION POSTGRES MIGRATION LOGS 15:30-15:35Z ===");
          console.log(JSON.stringify(clean,null,2));

          const existing=JSON.parse(
            fs.readFileSync("supabase-deployment-authority-audit.json","utf8")
          );
          existing.postgres_migration_logs=clean;
          fs.writeFileSync(
            "supabase-deployment-authority-audit.json",
            JSON.stringify(existing,null,2)+"\n"
          );
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: supabase-deployment-authority-audit
          path: supabase-deployment-authority-audit.json
          retention-days: 7
